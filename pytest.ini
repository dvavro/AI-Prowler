[pytest]
# =====================================================================
# AI-Prowler pytest configuration
# =====================================================================
#
# EXCLUDED FROM DEFAULT RUN (require real Cloudflare API / live infra):
#
#   e2e         — full end-to-end tests that MINT REAL LICENSES and
#                 CREATE REAL CLOUDFLARE TUNNELS. Running these pollutes
#                 the Cloudflare tunnel list and the KV license store.
#                 Run explicitly only when testing the provisioning flow:
#                   python -m pytest tests/test_tunnel_ingress_e2e.py -m e2e -v
#                   python -m pytest tests/e2e/ -m e2e -v
#
#   live_worker — tests that hit the LIVE production Worker API at
#                 https://api.ai-prowler.com (read-only but requires
#                 internet + admin token). Run explicitly:
#                   python -m pytest tests/subscription/test_worker_api.py -v
#
# ALL OTHER TESTS run by default (unit, mcp, gui, subscription mocks,
# messaging, analysis, scheduler, installer). No live infra touched.
# =====================================================================

addopts = -m "not e2e and not live_worker and not manual and not live_pwa and not live_db" --tb=short -q

markers =
    e2e: end-to-end tests that mint real licenses and create real Cloudflare tunnels (deselected by default)
    live_worker: tests that hit the live production Cloudflare Worker API (deselected by default)
    slow: tests that are slow (embedding model, file IO, subprocess) — included by default, skip with -m "not slow"
    live_pwa: tests that require the AI-Prowler HTTP server running on localhost:8000 (deselected by default)
    manual: manual timing/regression scripts that require live infra (claude CLI + OAuth token) — excluded from default run
    live_db: tests that connect to the REAL production ChromaDB at ~/AI-Prowler/rag_database
        instead of an isolated_env/AIPROWLER_TEST_STATE_DIR sandbox (deselected by default). A
        cold chromadb.PersistentClient() init racing against another live process already
        holding that same directory open (the running AI-Prowler server, the GUI, or any
        active MCP connection) can hang or corrupt the on-disk HNSW segment — see
        get_chroma_client()'s "Cold-init settle delay (v9.0.1)" docstring in rag_preprocessor.py.
        Found 2026-08-22: run_tests.bat's default run hung indefinitely inside
        chromadb/api/rust.py's native _query() with no Python-level deadlock, root-caused via
        faulthandler.dump_traceback_later() to exactly this race. Run explicitly, and only
        when nothing else is actively hitting AI-Prowler's live database:
            python -m pytest tests\mcp\test_private_dir_isolation.py -m live_db -v

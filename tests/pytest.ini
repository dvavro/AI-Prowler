[pytest]
# AI-Prowler 6.0.0 functional test suite configuration

testpaths = tests
python_files = test_*.py
python_classes = Test
python_functions = test_*

# Show short-format summary for failures, errors, xfails, xpasses
# Verbose mode lists every test name — useful for tracking progress against
# the test plan.
addopts =
    -ra
    -v
    --tb=short
    --strict-markers
    --color=yes
    -m "not e2e and not manual and not live_remote and not live_pwa and not live_db and not job_sheet_e2e and not mcp_tool_e2e and not jobs_gui_e2e and not jobs_gui_e2e_server and not jobs_gui_timemachine and not remote_gui_e2e"

markers =
    remote_gui_e2e: Playwright end-to-end tests that drive the LIVE Remote PWA (personal mode, /remote/) —
        ZTEST learnings/tasks, a sandbox folder (tests\gui_remote_e2e\sandbox), guarded writes, cleanup to 0.
        Never run by default — use tests\run_tests_gui_jobs_e2e.bat --remote. Spec: tests\REMOTE_PWA_E2E_TEST_SPEC.md.
    jobs_gui_e2e: Playwright end-to-end tests that drive the LIVE Jobs PWA in real Google Chrome against
        the real job database (personal mode). ZTEST data on sandbox date 2030-01-07 only, guarded writes,
        continuous cleanup. Excluded from the default run — use tests\run_tests_gui_jobs_e2e.bat.
        Spec: tests\JOBS_APP_E2E_TEST_SPEC.md
    jobs_gui_e2e_server: server-mode variant of jobs_gui_e2e — real users (tests\gui_jobs_e2e_server\users.local.json
        + AIPROWLER_SRV_TOKEN_* variables), one browser window per user, against the AI-Prowler Server's Jobs app.
        Never run by default — use tests\run_tests_gui_jobs_e2e.bat --server. Spec §6.11.
    jobs_gui_timemachine: TIME MACHINE suite — a throwaway copy of the app (own port, empty database, every
        email/SMS caught in an outbox) with a movable clock; walks weeks of work day by day. Never run by
        default — use tests\run_tests_gui_jobs_e2e.bat --timemachine. Spec §6.19.
    slow: tests that load the embedding model or do real chunking (>5 s each)
    ocr: tests requiring Tesseract on PATH
    regression: 10-minute pre-release smoke test (Section 8 of test plan)
    release_gate: fast checks that verify packaging and installer correctness
    e2e: end-to-end tests that spawn a real server subprocess over HTTP (requires mcp[cli])
    live_worker: tests that hit the live subscription worker at api.ai-prowler.com (skipped if offline)
    live_pwa: tests that require the AI-Prowler HTTP server running on localhost:8000
    manual: manual timing/regression scripts that require live infra (claude CLI + OAuth token) — excluded from default run
    live_remote: tests for /remote/ PWA that require a running HTTP server — excluded from default run; set AI_PROWLER_REMOTE_TEST_PORT to avoid colliding with installed AI-Prowler on port 8000
    not_live: marker for offline source-file checks in test_remote_pwa.py — always runs, no server needed
    live_db: tests that connect to the REAL production ChromaDB at ~/AI-Prowler/rag_database
        instead of an isolated_env/AIPROWLER_TEST_STATE_DIR sandbox (excluded from default run).
        A cold chromadb.PersistentClient() init here can race against any other live process
        touching that same directory (the running AI-Prowler server/GUI, or an active MCP
        connection) — see get_chroma_client()'s "Cold-init settle delay (v9.0.1)" docstring in
        rag_preprocessor.py, which documents this exact upstream chromadb/HNSW race as capable
        of corrupting the on-disk segment. Found 2026-08-22: run_tests.bat hung indefinitely
        inside chromadb/api/rust.py's native _query() — not a Python-level deadlock, confirmed
        via faulthandler.dump_traceback_later(). Run explicitly, only when nothing else is
        actively hitting AI-Prowler's live database:
            python -m pytest tests\mcp_tests\test_private_dir_isolation.py -m live_db -v
    job_sheet_e2e: end-to-end tests that drive the real Anthropic API against the actual
        installed ai_prowler_mcp.py and the real configured job tracker spreadsheet — tool
        selection AND correctness, not a mock. Distinct from the "e2e" marker above (which
        means real server subprocess + real Cloudflare tunnels/licenses) — these tests touch
        neither. Requires ANTHROPIC_API_KEY. Writes and reads real spreadsheet data using a
        synthetic ZTEST customer, auto-backs up before the first write, and restores that
        backup automatically ONLY on a full pass — a failure leaves the test data in place for
        inspection. tests/e2e/test_job_tracker_e2e.py and
        tests/e2e/test_contractor_workflow_e2e.py. Excluded from the default run (see addopts
        below) — invoke explicitly via:
            tests\e2e\run_release_gate_job_tracker.bat
            tests\e2e\run_release_gate_contractor_workflow.bat
        WARNING: test_contractor_workflow_e2e.py's invoice-send stage sends a REAL email to
        whatever TEST_EMAIL_TO is set to in that file — expect an actual inbox delivery each run.
    mcp_tool_e2e: broader MCP-tool E2E coverage beyond the job tracker (Phase 1: self-learning
        memory + knowledge retrieval / RAG + code-aware retrieval; later phases: communications,
        file editing, dev tools, indexing & admin — each phase added only after its own safety
        design, since several of those touch real files or the real production ChromaDB).
        Distinct from job_sheet_e2e (spreadsheet-specific) and from "e2e" (Cloudflare tunnels/
        licensing) above — never confuse the three. Does NOT require ANTHROPIC_API_KEY; calls
        installed tools directly rather than exercising Claude's tool-selection layer.
        tests/e2e/test_learnings_and_retrieval_e2e.py. Excluded from the default run — invoke via:
            run_e2e_mcp_tool.bat
        WARNING: TestSelfLearningMemory sends ONE real email (send_learnings_report, scoped to
        a synthetic test-only tag) and writes/deletes one real learning entry, cleaned up via
        delete_learning() at the end of the run.

# ── Warning filters ──────────────────────────────────────────────────────────
filterwarnings =
    # Tkinter GUI tests: root.after() fails without main loop — expected in pytest
    ignore::pytest.PytestUnhandledThreadExceptionWarning
    # Tkinter Variable.__del__ fires after test teardown — also expected in pytest
    ignore::pytest.PytestUnraisableExceptionWarning
    # DeprecationWarning from third-party libs
    ignore::DeprecationWarning:openpyxl.*
    ignore::DeprecationWarning:pytest_asyncio.*
    ignore::DeprecationWarning:starlette.*
    # starlette.testclient recommends httpx2 over httpx — third-party, not actionable
    ignore::starlette.testclient.StarletteDeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    # ChromaDB legacy embedding config deprecation
    ignore::DeprecationWarning:chromadb.*
    # pytest 10 deprecation: class-scoped fixture as instance method
    ignore::pytest.PytestRemovedIn10Warning

# When an xfail test starts passing, fail the suite. This is what makes the
# bug-tracking workflow work: fixer removes the @xfail marker as part of the
# fix PR, and CI catches them if they forget.
xfail_strict = true

# Treat tests that can't find rag_preprocessor as an early hard failure
# rather than collecting a thousand nonsense errors.
required_plugins =

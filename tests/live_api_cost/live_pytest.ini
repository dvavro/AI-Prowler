[pytest]
# The live agent cost tests' own settings — used only by run_live_api_cost_server.bat (this folder run on its own,
# e.g. on the server). run_tests.bat live-api-cost on the dev PC uses the main suite's settings as before.
addopts = --tb=short
markers =
    live_api_cost: PAID live agent tests on the real install (off by default)

<style>
/* Same look as the Jobs app (2026-10-28, David): dark surface top bar with the
   AI-Prowler icon top-left, cyan brand, ↻ refresh, update banner, version badge. */
:root{--bg:#07080f;--surface:#0e1018;--card:#12141f;--line:#2a2f45;--ink:#ffffff;--mute:#c0c6d8;--acc:#00d4ff;
--ok:#00e87a;--warn:#ffb700;--bad:#ff4455;--r:12px;
--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
padding-bottom:calc(88px + var(--safe-bot))}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
padding:calc(var(--safe-top) + 24px) 14px 8px}            /* the version badge has the strip above the buttons */
.topbar{display:flex;align-items:center;gap:10px;min-height:40px}
.brand-icon{width:34px;height:34px;border-radius:8px;overflow:hidden;border:1px solid rgba(0,212,255,.4);flex:none}
.brand-icon img{width:100%;height:100%;object-fit:cover;display:block}
.brand{min-width:0;flex:1}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--acc);line-height:1.1}
.brand-role{font-size:12px;color:#d0d4e0;letter-spacing:.04em;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-role .who{color:#d0d4e0}
.ibtn{flex:none;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;
background:none;border:1px solid var(--line);border-radius:10px;color:var(--acc);font-size:16px;cursor:pointer;padding:0;
-webkit-tap-highlight-color:transparent}
.ibtn svg{width:19px;height:19px}
.ibtn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);flex:none}
.conn-dot.offline{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
margin-left:-14px;margin-right:-14px;padding:0 14px 2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:8px 14px;font-size:13px;
white-space:nowrap;min-height:36px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab.on{color:var(--bg);background:var(--acc);border-color:var(--acc)}
main{padding:12px 14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.tk{display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.tk .id{color:var(--mute);font-size:12px}
.tk .t{font-weight:600;margin:2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--mute)}
.chip.P1{color:var(--bad);border-color:var(--bad)}.chip.P2{color:var(--warn);border-color:var(--warn)}
.chip.st{color:var(--acc);border-color:var(--acc)}.chip.late{color:var(--bad);border-color:var(--bad)}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px;font-weight:600;letter-spacing:.02em}
/* 16px text in every box: smaller makes iPhones zoom in on tap (and not zoom back) */
input,select,textarea{width:100%;background:#0a0c14;color:var(--ink);border:1px solid var(--line);border-radius:10px;
padding:12px;font:inherit;font-size:16px;min-height:46px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;vertical-align:middle;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--acc)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:96px;resize:vertical}
button.b{border:0;border-radius:10px;padding:12px 16px;min-height:46px;font:inherit;font-weight:700;background:var(--acc);color:#04121a;
cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button.b.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
button.b.warn{background:var(--warn)}button.b.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px;min-width:0}
.fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-bot));width:58px;height:58px;border-radius:50%;
font-size:30px;line-height:58px;padding:0;min-height:0;box-shadow:0 6px 20px rgba(0,212,255,.35);z-index:6}
.msg{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;overflow-wrap:anywhere}
.msg.public{border-color:var(--acc)}.msg.internal{border-color:var(--warn)}
.msg .h{font-size:12px;color:var(--mute)}
.card p,.card .t{overflow-wrap:anywhere}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs a{display:block;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);
background:#0a0c14;color:var(--mute);font-size:11px;text-align:center;text-decoration:none;padding:4px}
.thumbs img{width:100%;height:100%;object-fit:cover;margin:-4px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,82vw);gap:10px;overflow-x:auto;
-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding-bottom:6px}
@media (min-width:700px){.board{grid-auto-columns:minmax(220px,1fr)}}
.board>.col{scroll-snap-align:start}
.col h3{font-size:13px;color:var(--mute);margin:0 0 8px}
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-bot));transform:translateX(-50%);background:#1c2033;border:1px solid var(--line);
padding:10px 14px;border-radius:10px;display:none;max-width:90%;z-index:20}
.banner{background:#14243a;border:1px solid var(--acc);border-radius:10px;padding:8px 12px;margin-bottom:10px;cursor:pointer}
.muted{color:var(--mute)}.hide{display:none!important}
.tog{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);min-height:48px}
.tog input{width:22px}
.chip{min-height:26px;display:inline-flex;align-items:center}
[data-wrm]{display:inline-flex;align-items:center;justify-content:center;min-width:28px;min-height:28px;color:var(--bad);text-decoration:none}
/* New-version banner — same as the Jobs app */
#updateBanner{position:fixed;top:calc(var(--safe-top) + 28px);left:12px;right:12px;z-index:9999;background:var(--surface);
border:1px solid var(--acc);border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;
align-items:center;justify-content:space-between;gap:10px}
#updateBanner.show{display:flex}
#updateBanner .msg{font-size:13px;font-weight:600;color:#fff;border:0;margin:0;padding:0}
#updateBanner .actions{display:flex;gap:8px;flex-shrink:0}
#updateBanner button{border:none;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;min-height:36px}
#updateBanner .btn-later{background:transparent;border:1px solid var(--line);color:var(--mute)}
#updateBanner .btn-refresh{background:var(--acc);color:#04121a}
</style>

<body>
<!-- ── PWA version badge — same as the Jobs, Remote, HR Admin and HR Portal apps.
     The server fills in the build at serve time (ai_prowler_mcp.py _stamp_pwa_build).
     Tap it: green = latest, red = a newer one is waiting (tap again to load). -->
<style id="apPwaVerCss">
#apPwaVer{position:fixed;top:calc(env(safe-area-inset-top,0px) + 2px);right:4px;z-index:2147483000;
  font:600 10px/1.2 -apple-system,Segoe UI,Roboto,Arial,sans-serif;letter-spacing:.2px;
  padding:2px 6px;border-radius:9px;background:rgba(20,24,40,.72);color:#cfd6e6;
  border:1px solid rgba(255,255,255,.18);cursor:pointer;user-select:none;-webkit-user-select:none;
  white-space:nowrap;opacity:.9;-webkit-tap-highlight-color:transparent}
#apPwaVer.ok{background:#1b5e20;color:#fff;border-color:#2e7d32}
#apPwaVer.old{background:#b71c1c;color:#fff;border-color:#e53935}
#apPwaVer.busy{opacity:.55}
@media print{#apPwaVer{display:none}}
</style>
<div id="apPwaVer" title="App version — tap to check for a newer one" data-app="Service Desk"></div>
<script id="apPwaVerJs">
(function () {
  var BUILD = /*AP_PWA_BUILD*/'__AIPROWLER_PWA_BUILD__'/*AP_PWA_BUILD_END*/;
  var APP_ROOT = '/desk/';
  var el = document.getElementById('apPwaVer');
  if (!el) return;
  var stamped = BUILD.indexOf('__AIPROWLER') !== 0;      // false = file opened without the server
  var label = stamped ? 'v' + BUILD : 'dev build';
  el.textContent = label;
  el.setAttribute('aria-label', el.getAttribute('data-app') + ' app version ' + label);
  window.AIPROWLER_PWA_BUILD = stamped ? BUILD : '';
  var newer = null;
  function serverBuild() {
    return fetch(APP_ROOT + 'index.html?v=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (t) {
        var m = t.match(/\/\*AP_PWA_BUILD\*\/'([^']*)'\/\*AP_PWA_BUILD_END\*\//);
        if (!m) throw new Error('no build stamp');
        return m[1];
      });
  }
  el.addEventListener('click', function (ev) {
    ev.stopPropagation();
    if (newer) {                                        // second tap: load the newer build
      el.textContent = 'updating…';
      var go = function () { location.reload(); };
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
          navigator.serviceWorker.getRegistration().then(function (reg) {
            return reg ? reg.update() : null;
          }).then(go, go);
          return;
        }
      } catch (e) {}
      go();
      return;
    }
    el.className = 'busy';
    el.textContent = label + ' · checking…';
    serverBuild().then(function (srv) {
      if (srv === BUILD) {
        el.className = 'ok';
        el.textContent = label + ' ✓ latest';
      } else {
        newer = srv;
        el.className = 'old';
        el.textContent = label + ' → v' + srv + ' — tap to update';
      }
    }).catch(function () {
      el.className = '';
      el.textContent = label + ' · can\'t reach server';
    }).then(function () {
      if (!newer) setTimeout(function () { el.className = ''; el.textContent = label; }, 6000);
    });
  });
})();
</script>

<script>
'use strict';
const S = { mode: 'personal', token: '', me: null, filter: 'mine', tickets: [], cursor: '',
            open: null, poll: null };
const $ = s => document.querySelector(s);
const app = $('#app');

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, ms || 3500);
}
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function dueDay(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}
function isLate(t) { return t.due_resolve_at && !['Fixed', 'Closed'].includes(t.state) && new Date(t.due_resolve_at) < new Date(); }

async function api(method, path, body, isForm) {
  const h = { Authorization: 'Bearer ' + S.token };
  if (body && !isForm) h['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch(path, { method, headers: h, body: body ? (isForm ? body : JSON.stringify(body)) : undefined }); }
  catch (e) { setOnline(false); throw new Error('No connection — check your signal and try again.'); }
  setOnline(true);
  if (r.status === 401) { signOut('Please sign in again.'); throw new Error('signed out'); }
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json() : await r.blob();
  if (!r.ok) { const e = new Error((data && data.message) || ('Error ' + r.status)); e.status = r.status; throw e; }
  return data;
}

// ── sign in ────────────────────────────────────────────────────────────────
// ── new-version banner (same rules as the Jobs app) ─────────────────────────
// A new sw.js means a new app build. Ask the browser to check now, whenever the
// app comes back to the front, and every 30 minutes — browsers otherwise check
// only about once a day. "Later" hides it until the next tab change.
let _swReg = null, _updatePending = false;
function initUpdateBanner() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('/desk/sw.js').then(reg => {
    _swReg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner();
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner();
      });
    });
    reg.update().catch(() => {});
  }).catch(() => {});
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && _swReg) _swReg.update().catch(() => {});
  });
  setInterval(() => { if (_swReg) _swReg.update().catch(() => {}); }, 30 * 60 * 1000);
}
function showUpdateBanner() { _updatePending = true; $('#updateBanner').classList.add('show'); }
$('#updLater').addEventListener('click', () => $('#updateBanner').classList.remove('show'));
$('#updNow').addEventListener('click', () => location.reload());

// ── ↻ refresh: reload whatever is on screen ────────────────────────────────
async function refreshNow() {
  const b = $('#refreshBtn'); b.classList.add('spin');
  try {
    if (S.open) await openTicket(S.open.ticket_id);
    else if (S.filter === 'settings') await showSettings();
    else if (S.filter === 'reports') document.querySelector(".tab[data-filter='reports']").click();
    else await refreshList();
    loadDirectory(true);
  } finally { setTimeout(() => b.classList.remove('spin'), 350); }
}
$('#refreshBtn').addEventListener('click', refreshNow);
$('#signOutBtn').addEventListener('click', () => {
  if (!confirm('Sign out of Service Desk on this device?')) return;
  signOut('Signed out.');
});
function setOnline(on) { const d = $('#connDot'); d.classList.toggle('offline', !on); d.title = on ? 'Connected' : 'Offline — changes will not save'; }
window.addEventListener('online', () => setOnline(true));
window.addEventListener('offline', () => setOnline(false));

async function boot() {
  initUpdateBanner(); setOnline(navigator.onLine !== false);
  try { S.mode = (await (await fetch('/pwa-token')).json()).mode || 'personal'; } catch (_) {}
  S.token = sessionStorage.getItem('desk_token') || '';
  if (S.token) { try { await start(); return; } catch (_) {} }
  showLogin();
}
function showLogin(note) {
  stopPoll(); $('#tabs').classList.add('hide'); $('#fab').classList.add('hide'); $('#who').textContent = '';
  ['#refreshBtn', '#signOutBtn', '#bell'].forEach(s => $(s).classList.add('hide'));
  const server = S.mode === 'server';
  app.innerHTML = `<div class="card"><h2 style="margin:0 0 6px">Sign in</h2>
    <p class="muted">${server ? 'Use your AI-Prowler name and password (token) from the server\'s Admin tab.'
      : 'Use your AI-Prowler Bearer Token (Settings tab on your PC).'}</p>
    ${note ? `<p style="color:var(--warn)">${esc(note)}</p>` : ''}
    ${server ? '<label>Name</label><input id="lgName" autocomplete="username">' : ''}
    <label>${server ? 'Password' : 'Bearer Token'}</label>
    <input id="lgTok" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:12px"><button class="b" id="lgGo">Sign in</button></div></div>`;
  $('#lgGo').addEventListener('click', doLogin);
  $('#lgTok').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}
async function doLogin() {
  const tok = $('#lgTok').value.trim();
  try {
    if (S.mode === 'server') {
      const r = await fetch('/desk-api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: $('#lgName').value.trim(), token: tok }) });
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.message || 'Name or password not recognized.');
      S.token = d.access_token;
    } else {
      const r = await fetch('/pwa-verify', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: tok }) });
      if (!r.ok) throw new Error('That token is not right.');
      S.token = tok;
    }
    sessionStorage.setItem('desk_token', S.token);
    await start();
  } catch (e) { toast(e.message); }
}
function signOut(note) { sessionStorage.removeItem('desk_token'); S.token = ''; showLogin(note); }

async function start() {
  S.me = await api('GET', '/desk-api/me');
  const a = S.me.actor;
  $('#who').textContent = ' · ' + (a.name || a.id) + ' · ' + (S.me.edition === 'solo' ? 'Solo' : a.role.replace('_', ' '));
  $('#tabs').classList.remove('hide'); $('#fab').classList.remove('hide');
  $('#refreshBtn').classList.remove('hide'); $('#signOutBtn').classList.remove('hide');
  $('#tabSettings').classList.toggle('hide', a.role !== 'owner');
  $('#tabReports').classList.toggle('hide', !['owner', 'manager'].includes(a.role));
  $('#bell').classList.toggle('hide', !('serviceWorker' in navigator && 'PushManager' in window));
  await refreshList(); startPoll(); loadDirectory();
}

// ── list views ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); S.filter = b.dataset.filter; S.open = null;
  if (_updatePending) showUpdateBanner();               // "Later" only hides it until the next tab
  window.scrollTo(0, 0);
  if (S.filter === 'settings') showSettings();
  else if (S.filter === 'reports') showReports();
  else refreshList();
}));
$('#fab').addEventListener('click', showNew);

// ── web push: alerts on this phone even when the app is closed ──────────────
function b64ToBytes(s) {
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
$('#bell').addEventListener('click', async () => {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (ios && !standalone) { toast('On iPhone, first tap Share → Add to Home Screen, then open Service Desk from the home screen and tap 🔔.', 8000); return; }
  try {
    if ((await Notification.requestPermission()) !== 'granted') { toast('Alerts are blocked for this app in the phone settings.'); return; }
    const reg = await navigator.serviceWorker.ready;
    const key = (await api('GET', '/desk-api/push/key')).key;
    const sub = (await reg.pushManager.getSubscription()) ||
      await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
    await api('POST', '/desk-api/push/subscribe', { subscription: sub.toJSON() });
    toast('Alerts are on for this phone.');
  } catch (e) { toast('Could not turn on alerts: ' + e.message); }
});

function query() {
  switch (S.filter) {
    case 'mine': return '?open_only=1&mine=1';
    case 'overdue': return '?overdue=1';
    case 'closed': return '?state=Closed';
    default: return '?open_only=1';
  }
}
async function refreshList() {
  try {
    const d = await api('GET', '/desk-api/tickets' + query());
    S.tickets = d.tickets;
    S.cursor = d.cursor || S.cursor;
  } catch (e) { if (e.message !== 'signed out') toast(e.message); return; }
  S.filter === 'board' ? renderBoard() : renderList();
}
function card(t) {
  const late = isLate(t);
  return `<button class="card tk" data-open="${esc(t.ticket_id)}">
    <div class="id">${esc(t.ticket_id)} · ${esc(t.kind === 'external' ? 'customer' : t.kind)}${t.assignee ? ' · ' + esc(t.assignee) : ''}</div>
    <div class="t">${esc(t.title)}</div>
    <div class="chips"><span class="chip st">${esc(t.state)}</span><span class="chip ${esc(t.priority)}">${esc(t.priority)}</span>
    ${t.due_resolve_at && !['Fixed', 'Closed'].includes(t.state) ? `<span class="chip ${late ? 'late' : ''}">due ${esc(dueDay(t.due_resolve_at))}</span>` : ''}</div>
  </button>`;
}
function renderList() {
  const empty = { mine: 'Nothing on your plate.', open: 'No open tickets.', overdue: 'Nothing overdue.',
                  closed: 'No closed tickets yet.' }[S.filter];
  app.innerHTML = S.tickets.length ? S.tickets.map(card).join('') : `<p class="muted">${empty}</p>`;
}
function renderBoard() {
  const cols = S.me.states.filter(s => s !== 'Closed');
  app.innerHTML = `<p class="muted" style="margin-top:0">Drag a card to another column to move it.</p>
    <div class="board">${cols.map(s => `<div class="col" data-col="${esc(s)}"><h3>${esc(s)} (${S.tickets.filter(t => t.state === s).length})</h3>
    ${S.tickets.filter(t => t.state === s).map(card).join('') || '<p class="muted">—</p>'}</div>`).join('')}</div>`;
  app.querySelectorAll('.board .tk').forEach(c => {
    c.draggable = true;
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.open); });
  });
  app.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.style.outline = '2px dashed var(--acc)'; });
    col.addEventListener('dragleave', () => { col.style.outline = ''; });
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.style.outline = '';
      const t = S.tickets.find(x => x.ticket_id === e.dataTransfer.getData('text/plain'));
      const to = col.dataset.col;
      if (!t || t.state === to) return;
      if (!(S.me.transitions[t.state] || []).includes(to)) { toast(`Can't move from ${t.state} to ${to}.`); return; }
      let reason = '';
      if (needsReason(t.state, to)) { reason = prompt(`Reason for moving to ${to}?`) || ''; if (!reason.trim()) return; }
      try {
        await api('POST', `/desk-api/tickets/${t.ticket_id}/state`, { to_state: to, reason, expected_version: t.version });
        toast(`${t.ticket_id} → ${to}`);
      } catch (err) { toast(err.status === 409 ? 'Someone else just changed it — refreshed.' : err.message); }
      refreshList();
    });
  });
}

// ── reports (owner, managers) ──────────────────────────────────────────────
async function showReports(days) {
  days = days || 30;
  const since = new Date(Date.now() - days * 864e5).toISOString().slice(0, 10);
  const group = S.me.edition === 'business' ? 'assignee' : 'type';
  let d;
  try { d = await api('GET', `/desk-api/report?since=${since}&group_by=${group}`); } catch (e) { toast(e.message); return; }
  const row = (k, s) => `<tr><td>${esc(k)}</td><td>${s.tickets}</td><td>${s.open}</td><td>${s.closed}</td>
    <td>${s.median_first_response_min ?? '—'}</td><td>${s.median_resolution_hours ?? '—'}</td><td>${s.sla_breaches}</td>
    <td>${s.csat_avg ?? '—'}</td></tr>`;
  app.innerHTML = `<div class="card"><div class="row">${[7, 30, 90].map(n => `<button class="b ${n === days ? '' : 'ghost'}" data-days="${n}">${n} days</button>`).join('')}</div>
    <div style="overflow-x:auto"><table style="width:100%;margin-top:12px;font-size:13px;border-collapse:collapse">
    <tr class="muted"><th align="left">${group === 'assignee' ? 'Person' : 'Type'}</th><th>Tickets</th><th>Open</th><th>Closed</th>
    <th>First reply (min)</th><th>Fix (h)</th><th>SLA misses</th><th>Rating</th></tr>
    ${row('All', d.report.total)}${Object.entries(d.report.groups || {}).map(([k, s]) => row(k, s)).join('')}</table></div></div>`;
  app.querySelectorAll('[data-days]').forEach(b => b.addEventListener('click', () => showReports(+b.dataset.days)));
}

async function download(path, filename) {
  try {
    const blob = await api('GET', path);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  } catch (e) { toast(e.message); }
}
app.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) { e.preventDefault(); openTicket(o.dataset.open); }
});

// ── live updates (30 s) ────────────────────────────────────────────────────
function startPoll() { stopPoll(); S.poll = setInterval(pollOnce, 30000); }
function stopPoll() { if (S.poll) clearInterval(S.poll); S.poll = null; }
async function pollOnce() {
  if (!S.token || document.hidden) return;
  try {
    const u = await api('GET', '/desk-api/updates?since=' + encodeURIComponent(S.cursor || ''));
    S.cursor = u.cursor || S.cursor;
    if (!u.tickets.length) return;
    if (S.open) {
      const mine = u.tickets.find(t => t.ticket_id === S.open.ticket_id);
      if (mine && mine.version !== S.open.rev && !$('#changed')) {
        const b = document.createElement('div');
        b.className = 'banner'; b.id = 'changed'; b.textContent = 'This ticket was just changed — tap to reload.';
        b.addEventListener('click', () => openTicket(S.open.ticket_id));
        app.prepend(b);
      }
    } else if (S.filter !== 'settings') { refreshList(); }
  } catch (_) {}
}

// ── ticket detail ──────────────────────────────────────────────────────────
async function openTicket(id) {
  // Same ticket re-drawn after a save → stay where you were on the page;
  // a different ticket → start at the top (phones).
  const sameTicket = !!(S.open && S.open.ticket_id === id), keepY = window.scrollY;
  let d;
  try { d = await api('GET', '/desk-api/tickets/' + id); } catch (e) { toast(e.message); return; }
  const t = S.open = d.ticket;
  // The full ticket keeps its clocks under "sla" (as in ticket.json); the list
  // rows have them at the top. Lift them up so the due chip and the late flag
  // show here too (found by the time-machine story, 2026-10-27).
  if (t.sla) for (const k of ['due_response_at', 'due_resolve_at', 'first_response_at'])
    if (t[k] == null && t.sla[k] != null) t[k] = t.sla[k];
  const role = S.me.actor.role, biz = S.me.edition === 'business';
  const next = t.moves || (S.me.transitions[t.state] || []);   // only moves this person may make
  const canAssign = biz && ['owner', 'manager'].includes(role);
  const outside = t.kind !== 'internal';
  app.innerHTML = `
  <button class="b ghost" id="back">← Back</button>
  <div class="card" style="margin-top:10px">
    <div class="id muted">${esc(t.ticket_id)} · ${esc(t.kind === 'external' ? 'customer' : t.kind)} ticket · v${esc(t.rev)}</div>
    <h2 style="margin:4px 0 8px">${esc(t.title)}</h2>
    <div class="chips"><span class="chip st">${esc(t.state)}</span><span class="chip ${esc(t.priority)}">${esc(t.priority)}</span>
      ${t.assignee ? `<span class="chip">→ ${esc(t.assignee)}</span>` : ''}
      ${t.due_resolve_at ? `<span class="chip ${isLate(t) ? 'late' : ''}">due ${esc(dueDay(t.due_resolve_at))}</span>` : ''}
      ${t.job_id ? `<span class="chip">job ${esc(t.job_id)}</span>` : ''}
      ${t.contact_id ? `<span class="chip">contact ${esc(t.contact_id)}</span>` : ''}</div>
    ${t.description ? `<p style="white-space:pre-wrap">${esc(t.description)}</p>` : ''}
    ${t.resolution ? `<p style="white-space:pre-wrap"><b>Resolution:</b> ${esc(t.resolution)}</p>` : ''}
    ${role !== 'customer' ? `<button class="b ghost" id="resEdit">✍ ${t.resolution ? 'Edit' : 'Write'} resolution</button>` : ''}
  </div>
  <div class="card"><div class="row">${next.map(s => `<button class="b ${s === 'Closed' ? 'bad' : s === 'On Hold' ? 'warn' : ''}" data-move="${esc(s)}">${esc(s)}</button>`).join('') || '<span class="muted">No moves from here.</span>'}</div>
    ${canAssign ? `<label>Assign to (start typing a name)</label><div class="row"><input id="asg" list="dlTeam" value="${esc(t.assignee || '')}"><button class="b ghost" id="asgGo" style="flex:0">Assign</button></div>` : ''}
    ${['owner', 'manager'].includes(role) ? `<div class="row" style="margin-top:10px"><button class="b ghost" id="pdf">📄 PDF</button></div>` : ''}
    ${outside && t.contact_id ? `<div class="row" style="margin-top:10px"><button class="b ghost" id="lnk">🔗 Copy status link</button>
      ${t.kind === 'external' ? '<button class="b ghost" id="redo">🗓 Schedule re-do</button>' : ''}</div>` : ''}
  </div>
  ${watchersCard(t)}
  <div class="card"><h3 style="margin:0 0 6px">Photos & files</h3>
    <div class="thumbs" id="thumbs">${(t.attachments || []).map(a => `<a href="#" data-att="${esc(a.attachment_id)}" data-name="${esc(a.filename)}" data-kind="${esc(a.kind)}" data-thumb="${a.thumb_path ? 1 : 0}">${esc(a.kind === 'photo' ? '' : a.filename)}</a>`).join('') || '<span class="muted">None yet.</span>'}</div>
    <div class="row" style="margin-top:10px">
      <label class="b ghost" style="text-align:center;margin:0">📷 Camera<input type="file" accept="image/*" capture="environment" class="hide" id="cam"></label>
      <label class="b ghost" style="text-align:center;margin:0">📎 File<input type="file" multiple class="hide" id="file"
        accept=".jpg,.jpeg,.png,.heic,.heif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.mp4,.mov"></label>
    </div>
    ${outside ? `<label><input type="checkbox" id="attInternal" style="width:auto"> Internal only (customer never sees it)</label>` : ''}
  </div>
  <div class="card"><h3 style="margin:0 0 6px">Messages</h3>
    ${(t.messages || []).map(m => `<div class="msg ${esc(m.visibility)}"><div class="h">${esc(m.author)} · ${esc(m.visibility === 'public' ? 'to/from ' + (t.kind === 'subcontractor' ? 'sub' : 'customer') : 'internal note')} · ${esc(when(m.at))}</div>${esc(m.body)}</div>`).join('') || '<p class="muted">No messages yet.</p>'}
    <textarea id="msg" placeholder="Write a note…"></textarea>
    <div class="row" style="margin-top:8px">
      ${outside ? `<select id="msgVis" style="flex:2"><option value="internal">Internal note</option><option value="public">Reply to ${t.kind === 'subcontractor' ? 'subcontractor' : 'customer'}</option></select>` : ''}
      <button class="b" id="msgGo" style="flex:1">Add</button></div>
  </div>
  <div class="card muted" style="font-size:13px">${(t.state_history || []).map(h => `${esc(when(h.at))} — ${esc(h.to)}${h.reason ? ' (' + esc(h.reason) + ')' : ''} · ${esc(h.by)}`).join('<br>')}</div>`;
  $('#back').addEventListener('click', () => { S.open = null; refreshList(); });
  app.querySelectorAll('[data-move]').forEach(b => b.addEventListener('click', () => move(t, b.dataset.move)));
  if (canAssign) $('#asgGo').addEventListener('click', () => post(t, 'assign', { assignee: $('#asg').value.trim() }));
  if ($('#resEdit')) $('#resEdit').addEventListener('click', () => {
    const v = prompt('How was it fixed? (saved on the ticket and used to find past fixes)', t.resolution || '');
    if (v !== null && v.trim()) post(t, 'update', { fields: { resolution: v.trim() } });
  });
  if ($('#pdf')) $('#pdf').addEventListener('click', () =>
    download(`/desk-api/export?format=pdf&ticket_id=${t.ticket_id}`, `${t.ticket_id}.pdf`));
  if ($('#lnk')) $('#lnk').addEventListener('click', async () => {
    try {
      const d = await api('POST', `/desk-api/tickets/${t.ticket_id}/link`, {});
      try { await navigator.clipboard.writeText(d.url); toast('Status link copied.'); }
      catch (_) { prompt('Status link:', d.url); }
    } catch (e) { toast(e.message); }
  });
  if ($('#redo')) $('#redo').addEventListener('click', async () => {
    const day = prompt('Re-do date (YYYY-MM-DD)?'); if (!day) return;
    let cust = t.customer_id || '';
    if (!cust) { cust = prompt('Jobs app customer id (CUST-####)?') || ''; if (!cust) return; }
    try {
      const d = await api('POST', `/desk-api/tickets/${t.ticket_id}/job`, { service_date: day.trim(), customer_id: cust.trim() });
      toast(d.message.replace(/^✅\s*/, '')); openTicket(t.ticket_id);
    } catch (e) { toast(e.message); }
  });
  $('#msgGo').addEventListener('click', () => {
    const body = $('#msg').value.trim(); if (!body) return;
    sendMessage(t, body, $('#msgVis') ? $('#msgVis').value : 'internal');
  });
  ['#cam', '#file'].forEach(s => $(s).addEventListener('change', e => upload(t, e.target.files)));
  loadThumbs();
  wireWatchers(t);
  window.scrollTo(0, sameTicket ? keepY : 0);
}

// ── address book + watchers (2026-10-28) ───────────────────────────────────
// One list of every address the team may pick from — team, my saved contacts,
// Jobs customers, past ticket contacts — offered as people type.
async function loadDirectory(force) {
  if (!S.me || (S.dir && !force) || S.me.actor.role === 'customer' || S.me.actor.role === 'subcontractor') return;
  try { S.dir = await api('GET', '/desk-api/directory'); } catch (_) { S.dir = { entries: [], team: [] }; }
  const make = (id, opts) => { let d = document.getElementById(id);
    if (!d) { d = document.createElement('datalist'); d.id = id; document.body.appendChild(d); }
    d.innerHTML = opts; };
  make('dlEmail', S.dir.entries.map(e => `<option value="${esc(e.email)}">${esc((e.name ? e.name + ' · ' : '') + e.source)}</option>`).join(''));
  make('dlTeam', (S.dir.team || []).map(u => `<option value="${esc(u.id)}">${esc(u.name + ' · ' + u.role + (u.email ? ' · ' + u.email : ''))}</option>`).join(''));
}
function dirEntry(v) {
  const x = (v || '').trim().toLowerCase(); if (!x || !S.dir) return null;
  return S.dir.entries.find(e => e.email === x) || S.dir.entries.find(e => e.name.toLowerCase() === x) || null;
}
function canEditWatchers(t) {
  const a = S.me.actor; return a.role === 'owner' || a.role === 'manager' || t.assignee === a.id;
}
function watchersCard(t) {
  if (!Array.isArray(t.watchers)) return '';                 // outside parties never get the list
  const me = (S.me.actor.email || '').toLowerCase(), edit = canEditWatchers(t);
  const watching = t.watchers.some(w => w.email === me);
  return `<div class="card" id="wCard"><h3 style="margin:0 0 6px">Watchers <span class="muted" style="font-size:12px;font-weight:400">— emailed on every change of state</span></h3>
    <div id="wList">${t.watchers.map(w => `<span class="chip" data-watcher="${esc(w.email)}">${esc(w.name ? w.name + ' <' + w.email + '>' : w.email)}
      ${edit || w.email === me ? `<a href="#" data-wrm="${esc(w.email)}" title="Remove" style="margin-left:4px">✕</a>` : ''}</span>`).join(' ') || '<span class="muted">Nobody yet.</span>'}</div>
    ${edit ? `<div class="row" style="margin-top:8px"><input id="wEmail" list="dlEmail" placeholder="name or email — start typing">
      <button class="b ghost" id="wAdd" style="flex:0">Add</button></div>` : ''}
    ${!edit && me ? `<div class="row" style="margin-top:8px"><button class="b ghost" id="wMe">${watching ? 'Stop watching' : '👁 Watch this ticket'}</button></div>` : ''}</div>`;
}
function wireWatchers(t) {
  if (!$('#wCard')) return;
  const send = async (email, name, remove) => {
    try { await api('POST', `/desk-api/tickets/${t.ticket_id}/watchers`, { email, name, remove: !!remove });
          toast(remove ? 'Removed.' : 'Added — they\'ll be emailed when it changes.'); openTicket(t.ticket_id); }
    catch (e) { toast(e.message); }
  };
  if ($('#wAdd')) $('#wAdd').addEventListener('click', () => {
    const v = $('#wEmail').value.trim(); if (!v) return;
    const hit = dirEntry(v);
    if (!hit && !v.includes('@')) { toast('No email on file for that name — type the address.'); return; }
    send(hit ? hit.email : v, hit ? hit.name : '', false);
  });
  if ($('#wMe')) $('#wMe').addEventListener('click', () => {
    const me = S.me.actor.email, on = t.watchers.some(w => w.email === me.toLowerCase());
    send(me, S.me.actor.name || '', on);
  });
  app.querySelectorAll('[data-wrm]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); send(a.dataset.wrm, '', true); }));
}
function needsReason(from, to) { return S.me.needs_reason.some(p => p[0] === from && p[1] === to); }
async function move(t, to) {
  let reason = '';
  if (needsReason(t.state, to)) {
    reason = prompt(`Reason for moving to ${to}?`) || '';
    if (!reason.trim()) { toast('A reason is needed for that move.'); return; }
  } else if (to === 'Closed' && !confirm('Close this ticket?')) { return; }
  post(t, 'state', { to_state: to, reason });
}
async function post(t, action, body) {
  try {
    await api('POST', `/desk-api/tickets/${t.ticket_id}/${action}`, { ...body, expected_version: t.rev });
    toast('Saved.'); openTicket(t.ticket_id);
  } catch (e) {
    if (e.status === 409) { toast('Someone else changed this ticket — reloading.'); openTicket(t.ticket_id); }
    else toast(e.message);
  }
}
async function sendMessage(t, body, visibility) {
  try { await api('POST', `/desk-api/tickets/${t.ticket_id}/messages`, { body, visibility }); openTicket(t.ticket_id); }
  catch (e) { toast(e.message); }
}
async function upload(t, files) {
  if (!files || !files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('file', f, f.name);
  fd.append('visibility', $('#attInternal') && $('#attInternal').checked ? 'internal' : 'public');
  toast('Uploading…', 60000);
  try { await api('POST', `/desk-api/tickets/${t.ticket_id}/attachments`, fd, true); toast('Uploaded.'); openTicket(t.ticket_id); }
  catch (e) { toast(e.message); }
}
async function loadThumbs() {
  for (const a of app.querySelectorAll('[data-att]')) {
    a.addEventListener('click', async e => {
      e.preventDefault();
      try {
        const blob = await api('GET', '/desk-api/attachments/' + a.dataset.att);
        const url = URL.createObjectURL(blob); window.open(url, '_blank');
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (err) { toast(err.message); }
    });
    if (a.dataset.thumb === '1') {
      try {
        const blob = await api('GET', '/desk-api/attachments/' + a.dataset.att + '?thumb=1');
        a.innerHTML = `<img alt="${esc(a.dataset.name)}" src="${URL.createObjectURL(blob)}">`;
      } catch (_) {}
    }
  }
}

// ── new ticket ─────────────────────────────────────────────────────────────
function showNew() {
  S.open = null;
  const kinds = S.me.kinds;
  if (!kinds.length) { toast('Filing tickets is switched off.'); return; }
  const label = { external: 'Customer request', internal: S.me.edition === 'solo' ? 'My own ticket' : 'Internal', subcontractor: 'Subcontractor' };
  app.innerHTML = `<button class="b ghost" id="back">← Back</button>
  <div class="card" style="margin-top:10px"><h2 style="margin:0">New ticket</h2>
    <label>Kind</label><select id="nKind">${kinds.map(k => `<option value="${k}">${label[k]}</option>`).join('')}</select>
    <label>Title</label><input id="nTitle" maxlength="200">
    <label>Details</label><textarea id="nDesc"></textarea>
    <div id="nParty"><label id="nPartyLbl">Customer name</label><input id="nName">
      <div class="row"><div><label>Phone</label><input id="nPhone" type="tel"></div><div><label>Email</label><input id="nEmail" type="email" list="dlEmail" placeholder="start typing — picks from your contacts"></div></div>
      <label>Job id (optional)</label><input id="nJob"></div>
    <div class="row"><div><label>Priority</label><select id="nPri"><option>P3</option><option>P1</option><option>P2</option><option>P4</option></select></div>
      <div><label>Due</label><input id="nDue" type="date"></div></div>
    <label><input type="checkbox" id="nSms" style="width:auto"> Also alert by text (SMS)</label>
    <div class="row" style="margin-top:12px"><button class="b" id="nGo">File ticket</button></div></div>`;
  const syncKind = () => {
    const k = $('#nKind').value;
    $('#nParty').classList.toggle('hide', k === 'internal');
    $('#nPartyLbl').textContent = k === 'subcontractor' ? 'Subcontractor name' : 'Customer name';
  };
  $('#nKind').addEventListener('change', syncKind); syncKind();
  $('#nEmail').addEventListener('change', () => {          // picked from the list: fill the rest
    const hit = dirEntry($('#nEmail').value);
    if (!hit) return;
    if (!$('#nName').value.trim() && hit.name) $('#nName').value = hit.name;
    if (!$('#nPhone').value.trim() && hit.phone) $('#nPhone').value = hit.phone;
  });
  $('#back').addEventListener('click', () => refreshList());
  $('#nGo').addEventListener('click', async () => {
    const k = $('#nKind').value;
    const body = { kind: k, title: $('#nTitle').value.trim(), description: $('#nDesc').value.trim(),
      priority: $('#nPri').value, due: $('#nDue').value, sms_fallback: $('#nSms').checked };
    if (k !== 'internal') Object.assign(body, { contact_name: $('#nName').value.trim(),
      contact_phone: $('#nPhone').value.trim(), contact_email: $('#nEmail').value.trim(), job_id: $('#nJob').value.trim() });
    if (!body.title) { toast('Give the ticket a title.'); return; }
    try { const d = await api('POST', '/desk-api/tickets', body); toast('Filed ' + d.ticket.ticket_id); openTicket(d.ticket.ticket_id); }
    catch (e) { toast(e.message); }
  });
}

// ── settings (owner) ───────────────────────────────────────────────────────
async function showSettings() {
  const s = (await api('GET', '/desk-api/settings')).settings;
  const rows = [['own_tickets', 'I can file tickets to myself', S.me.edition === 'solo'],
                ['subcontractor_tickets', 'I can open tickets about a subcontractor', true],
                ['sms_fallback_default', 'New tickets also alert by text (SMS)', true],
                ['portal_enabled', 'Customers can request service online (/support/new)', true],
                ['email_intake', 'Read our email account for ticket replies', true],
                ['csat_enabled', 'Ask customers to rate closed requests', true],
                ['customer_status_updates', 'Tell customers (one line) when their request is in progress and when it\'s closed', true]].filter(r => r[2]);
  const modes = `<label>A text that isn't a reply to a ticket</label>
    <select data-mode="sms_new_request_mode">${[['off', 'Do nothing'], ['ask', 'Ask if they want a request opened'],
      ['link', 'Text back the request-form link'], ['create', 'Open a ticket automatically']]
      .map(o => `<option value="${o[0]}" ${s.sms_new_request_mode === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
    <label>An email that isn't a reply to a ticket</label>
    <select data-mode="email_new_request_mode">${[['off', 'Do nothing'], ['create', 'Open a ticket automatically']]
      .map(o => `<option value="${o[0]}" ${s.email_new_request_mode === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
  const solo = S.me.edition === 'solo';
  app.innerHTML = `<div class="card"><h2 style="margin:0 0 6px">Settings</h2>${rows.map(r =>
    `<div class="tog"><input type="checkbox" data-set="${r[0]}" ${s[r[0]] ? 'checked' : ''}><span>${esc(r[1])}</span></div>`).join('')}
    ${modes}
    <label>Close a Fixed customer ticket after this many days with no reply (0 = never)</label>
    <div class="row"><input id="acDays" type="number" min="0" max="60" value="${esc(s.auto_close_days)}">
      <button class="b ghost" id="acSave" style="flex:0">Save</button></div>
    ${solo ? `<label>Send my alerts to (email)</label><input id="alEmail" type="email" value="${esc(s.alert_email)}">
    <label>My mobile for text alerts</label><input id="alPhone" type="tel" value="${esc(s.alert_phone)}">
    <div class="row" style="margin-top:8px"><button class="b" id="alSave">Save alert contacts</button></div>` : ''}
    <div class="row" style="margin-top:12px"><button class="b ghost" id="out">Sign out</button></div></div>`;
  if (solo) $('#alSave').addEventListener('click', async () => {
    try {
      await api('POST', '/desk-api/settings', { key: 'alert_email', value: $('#alEmail').value.trim() });
      await api('POST', '/desk-api/settings', { key: 'alert_phone', value: $('#alPhone').value.trim() });
      toast('Saved.');
    } catch (e) { toast(e.message); }
  });
  app.querySelectorAll('[data-set]').forEach(c => c.addEventListener('change', async () => {
    try { await api('POST', '/desk-api/settings', { key: c.dataset.set, value: c.checked });
          S.me = await api('GET', '/desk-api/me'); toast('Saved.'); }
    catch (e) { toast(e.message); c.checked = !c.checked; }
  }));
  app.querySelectorAll('[data-mode]').forEach(sel => sel.addEventListener('change', async () => {
    try { await api('POST', '/desk-api/settings', { key: sel.dataset.mode, value: sel.value }); toast('Saved.'); }
    catch (e) { toast(e.message); }
  }));
  $('#acSave').addEventListener('click', async () => {
    const n = parseInt($('#acDays').value, 10);
    if (!(n >= 0 && n <= 60)) { toast('Enter 0 to 60 days.'); return; }
    try { await api('POST', '/desk-api/settings', { key: 'auto_close_days', value: n }); toast('Saved.'); }
    catch (e) { toast(e.message); }
  });
  $('#out').addEventListener('click', () => signOut());
  await renderDataSection();
  if (S.me.edition === 'business') await renderTeamSection();
}

// ── Settings → Data: export, import, backups ───────────────────────────────
async function renderDataSection() {
  let b;
  try { b = await api('GET', '/desk-api/backups'); } catch (e) { toast(e.message); return; }
  const st = b.settings;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2 style="margin:0 0 6px">Data</h2>
    <label>Export</label><div class="row">
      <button class="b ghost" data-exp="xlsx">Excel</button><button class="b ghost" data-exp="csv">CSV</button>
      <button class="b ghost" data-exp="json">Full (moves to another Service Desk)</button></div>
    <label>Import (.csv, .xlsx or a full export .zip)</label>
    <input type="file" id="impFile" accept=".csv,.xlsx,.zip">
    <div class="row" style="margin-top:8px"><button class="b ghost" id="impDry">Check file (dry run)</button>
      <button class="b hide" id="impGo">Import now</button></div>
    <pre id="impOut" class="muted" style="white-space:pre-wrap"></pre>
    <div class="row"><input id="undoId" placeholder="Batch id to undo (IMP-…)"><button class="b ghost" id="undoGo" style="flex:0">Undo import</button></div>
    <label>Backups</label>
    <div class="row"><button class="b" id="bkNow">Back up now</button></div>
    <div id="bkList" style="margin-top:8px">${b.backups.slice(0, 15).map(x => `<div class="tog" style="flex-wrap:wrap">
      <span style="flex:1">${esc(x.made_at.replace('T', ' ').slice(0, 16))} · ${esc(x.trigger)} · ${Math.max(1, Math.round(x.bytes / 1024))} KB · ${x.verified ? '✔ verified' : '⚠ not verified'}</span>
      <button class="b ghost" data-dl="${esc(x.name)}" style="flex:0">Download</button>
      <button class="b warn" data-rs="${esc(x.name)}" style="flex:0">Restore…</button></div>`).join('') || '<p class="muted">No backups yet.</p>'}</div>
    <label>Automatic backups</label>
    <div class="tog"><input type="checkbox" id="bkOn" ${st.backup_enabled ? 'checked' : ''}><span>On</span></div>
    <div class="row"><div><label>How often</label><select id="bkFreq">${['hourly', 'daily', 'weekly'].map(f => `<option ${st.backup_frequency === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
      <div><label>At hour (0-23)</label><input id="bkHour" type="number" min="0" max="23" value="${st.backup_hour}"></div></div>
    <div class="row"><div><label>Keep daily</label><input id="bkD" type="number" min="1" value="${st.backup_keep_daily}"></div>
      <div><label>weekly</label><input id="bkW" type="number" min="1" value="${st.backup_keep_weekly}"></div>
      <div><label>monthly</label><input id="bkM" type="number" min="1" value="${st.backup_keep_monthly}"></div></div>
    <div class="tog"><input type="checkbox" id="bkAtt" ${st.backup_attachments ? 'checked' : ''}><span>Include photos and documents</span></div>
    <label>Second copy to (drive, NAS or synced folder — optional)</label><input id="bkDir" value="${esc(st.backup_second_dir)}">
    <div class="row" style="margin-top:8px"><button class="b" id="bkSave">Save backup settings</button></div>`;
  app.appendChild(card);
  card.querySelectorAll('[data-exp]').forEach(btn => btn.addEventListener('click', () => {
    const f = btn.dataset.exp;
    download(`/desk-api/export?format=${f}`, `service-desk-${new Date().toISOString().slice(0, 10)}.${f === 'xlsx' ? 'xlsx' : 'zip'}`);
  }));
  const runImport = async dry => {
    const f = $('#impFile').files[0]; if (!f) { toast('Choose a file first.'); return; }
    const fd = new FormData(); fd.append('file', f, f.name); fd.append('dry_run', dry ? '1' : '0');
    try {
      const r = (await api('POST', '/desk-api/import', fd, true)).result;
      $('#impOut').textContent = `${r.dry_run ? 'Dry run — nothing imported yet.' : 'Imported as ' + r.batch_id + ' (undo for 7 days).'}
Rows: ${r.rows}, to add: ${r.to_add}, duplicates: ${r.duplicates.length}, invalid: ${r.invalid.length}` +
        r.invalid.slice(0, 10).map(x => `\n  row ${x.row}: ${x.problems.join(', ')}`).join('');
      $('#impGo').classList.toggle('hide', !(r.dry_run && r.to_add));
    } catch (e) { toast(e.message); }
  };
  $('#impDry').addEventListener('click', () => runImport(true));
  $('#impGo').addEventListener('click', () => { if (confirm('Import now? A backup is taken first.')) runImport(false); });
  $('#undoGo').addEventListener('click', async () => {
    const id = $('#undoId').value.trim(); if (!id || !confirm(`Remove every ticket imported in ${id}?`)) return;
    try { const r = (await api('POST', '/desk-api/import/undo', { batch_id: id })).result; toast(`Removed ${r.removed.length} ticket(s).`); }
    catch (e) { toast(e.message); }
  });
  $('#bkNow').addEventListener('click', async () => {
    try { const r = (await api('POST', '/desk-api/backups', {})).backup; toast(`Backed up (${r.verified ? 'verified' : 'NOT verified'}).`); showSettings(); }
    catch (e) { toast(e.message); }
  });
  card.querySelectorAll('[data-dl]').forEach(btn => btn.addEventListener('click', () => download(`/desk-api/backups/${btn.dataset.dl}`, btn.dataset.dl)));
  card.querySelectorAll('[data-rs]').forEach(btn => btn.addEventListener('click', async () => {
    const one = prompt('Restore ONE ticket? Enter its number (e.g. T-0042), or leave blank to restore EVERYTHING.');
    if (one === null) return;
    const what = one.trim() ? `ticket ${one.trim().toUpperCase()}` : 'ALL Service Desk data';
    if (!confirm(`Replace ${what} with the copy in this backup? A safety backup is taken first.`)) return;
    try {
      const r = (await api('POST', '/desk-api/backups/restore', { name: btn.dataset.rs, ticket_id: one.trim(), confirm: true })).result;
      toast(`Restored ${r.restored}. Safety backup: ${r.safety_backup}`); showSettings();
    } catch (e) { toast(e.message); }
  }));
  $('#bkSave').addEventListener('click', async () => {
    const vals = { backup_enabled: $('#bkOn').checked, backup_frequency: $('#bkFreq').value, backup_hour: +$('#bkHour').value,
      backup_keep_daily: +$('#bkD').value, backup_keep_weekly: +$('#bkW').value, backup_keep_monthly: +$('#bkM').value,
      backup_attachments: $('#bkAtt').checked, backup_second_dir: $('#bkDir').value.trim() };
    try { for (const [k, v] of Object.entries(vals)) await api('POST', '/desk-api/settings', { key: k, value: v }); toast('Saved.'); }
    catch (e) { toast(e.message); }
  });
}

// ── Settings → Team (Business): queues, rules, types ───────────────────────
async function renderTeamSection() {
  let d;
  try { d = await api('GET', '/desk-api/team'); } catch (e) { toast(e.message); return; }
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2 style="margin:0 0 6px">Team</h2>
    <label>Queues (new tickets go round-robin to members who aren't on time off)</label>
    ${d.queues.map(q => `<div class="tog"><span style="flex:1"><b>${esc(q.queue_id)}</b> ${esc(q.name)} — ${esc(q.members.join(', ') || 'no members')}</span>
      <button class="b ghost" data-qdel="${esc(q.queue_id)}" style="flex:0">Delete</button></div>`).join('') || '<p class="muted">No queues yet.</p>'}
    <div class="row"><input id="qId" placeholder="queue id (e.g. field)"><input id="qName" placeholder="name"></div>
    <div class="row" style="margin-top:6px"><input id="qMem" placeholder="member user ids, comma-separated"><button class="b ghost" id="qSave" style="flex:0">Save queue</button></div>
    <label>Assignment rules (first match wins)</label>
    ${d.rules.map(r => `<div class="tog"><span style="flex:1">${r.sort_order}. <b>${esc(r.rule_id)}</b> ${esc(JSON.stringify(r.match))} → ${esc(JSON.stringify(r.action))}</span>
      <button class="b ghost" data-rdel="${esc(r.rule_id)}" style="flex:0">Delete</button></div>`).join('') || '<p class="muted">No rules yet.</p>'}
    <div class="row"><input id="rId" placeholder="rule id"><select id="rOn"><option value="keyword">if title/details contain</option><option value="type">if type is</option></select><input id="rVal" placeholder="value"></div>
    <div class="row" style="margin-top:6px"><select id="rTo"><option value="user">send to person</option><option value="queue">send to queue</option></select><input id="rTarget" placeholder="user id or queue id">
      <input id="rOrder" type="number" value="100" style="max-width:90px"><button class="b ghost" id="rSave" style="flex:0">Save rule</button></div>
    <label>Ticket types</label>
    ${d.types.map(t => `<div class="muted">${esc(t.type_id)} — ${esc(t.name)} (${esc(t.kind)}) → ${esc(t.default_queue || 'no queue')}, ${esc(t.default_priority)}</div>`).join('') || '<p class="muted">No types yet.</p>'}
    <div class="row"><input id="tId" placeholder="type id (e.g. redo)"><input id="tName" placeholder="name"><input id="tQueue" placeholder="default queue"></div>
    <div class="row" style="margin-top:6px"><button class="b ghost" id="tSave">Save type</button></div>`;
  app.appendChild(card);
  const post = async (path, body) => { try { await api('POST', path, body); toast('Saved.'); showSettings(); } catch (e) { toast(e.message); } };
  $('#qSave').addEventListener('click', () => post('/desk-api/team/queue', { queue_id: $('#qId').value.trim(), name: $('#qName').value.trim(), members: $('#qMem').value }));
  card.querySelectorAll('[data-qdel]').forEach(b => b.addEventListener('click', () => confirm('Delete this queue?') && post('/desk-api/team/queue/delete', { queue_id: b.dataset.qdel })));
  $('#rSave').addEventListener('click', () => post('/desk-api/team/rule', { rule_id: $('#rId').value.trim(),
    match: { [$('#rOn').value]: $('#rVal').value.trim() }, action: { [$('#rTo').value]: $('#rTarget').value.trim() }, order: +$('#rOrder').value || 100 }));
  card.querySelectorAll('[data-rdel]').forEach(b => b.addEventListener('click', () => confirm('Delete this rule?') && post('/desk-api/team/rule/delete', { rule_id: b.dataset.rdel })));
  $('#tSave').addEventListener('click', () => post('/desk-api/team/type', { type_id: $('#tId').value.trim(), name: $('#tName').value.trim(), default_queue: $('#tQueue').value.trim() }));
}

boot();
</script>
</body>
</html>

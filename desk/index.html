<style>
/* Same look as the Jobs app (2026-10-28, David): dark surface top bar with the
   AI-Prowler icon top-left, cyan brand, ↻ refresh, update banner, version badge. */
:root{--bg:#07080f;--surface:#0e1018;--card:#12141f;--line:#2a2f45;--ink:#ffffff;--mute:#c0c6d8;--acc:#00d4ff;
--ok:#00e87a;--warn:#ffb700;--bad:#ff4455;--r:12px;
--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
padding-bottom:calc(88px + var(--safe-bot))}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
padding:calc(var(--safe-top) + 24px) 14px 8px}            /* the version badge has the strip above the buttons */
.topbar{display:flex;align-items:center;gap:10px;min-height:40px}
.brand-icon{width:34px;height:34px;border-radius:8px;overflow:hidden;border:1px solid rgba(0,212,255,.4);flex:none}
.brand-icon img{width:100%;height:100%;object-fit:cover;display:block}
.brand{min-width:0;flex:1}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--acc);line-height:1.1}
.brand-role{font-size:12px;color:#d0d4e0;letter-spacing:.04em;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-role .who{color:#d0d4e0}
.ibtn{flex:none;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;
background:none;border:1px solid var(--line);border-radius:10px;color:var(--acc);font-size:16px;cursor:pointer;padding:0;
-webkit-tap-highlight-color:transparent}
.ibtn svg{width:19px;height:19px}
.ibtn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);flex:none}
.conn-dot.offline{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
margin-left:-14px;margin-right:-14px;padding:0 14px 2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:8px 14px;font-size:13px;
white-space:nowrap;min-height:36px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab.on{color:var(--bg);background:var(--acc);border-color:var(--acc)}
main{padding:12px 14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.tk{display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.tk .id{color:var(--mute);font-size:12px}
.tk .t{font-weight:600;margin:2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--mute)}
.chip.P1{color:var(--bad);border-color:var(--bad)}.chip.P2{color:var(--warn);border-color:var(--warn)}
.chip.st{color:var(--acc);border-color:var(--acc)}.chip.late{color:var(--bad);border-color:var(--bad)}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px;font-weight:600;letter-spacing:.02em}
/* 16px text in every box: smaller makes iPhones zoom in on tap (and not zoom back) */
input,select,textarea{width:100%;background:#0a0c14;color:var(--ink);border:1px solid var(--line);border-radius:10px;
padding:12px;font:inherit;font-size:16px;min-height:46px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;vertical-align:middle;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--acc)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:96px;resize:vertical}
button.b{border:0;border-radius:10px;padding:12px 16px;min-height:46px;font:inherit;font-weight:700;background:var(--acc);color:#04121a;
cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button.b.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
button.b.warn{background:var(--warn)}button.b.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* A button sized to its words next to a box (Save, Undo import, Assign…) — "flex:0"
   on its own let it shrink to nothing and the text spilled out (David 2026-10-28) */
.row>button.b[style*="flex:0"],.tog>button.b[style*="flex:0"]{flex:0 0 auto!important;white-space:nowrap}

.auth-screen input.auth-input{width:100%;max-width:320px;background:var(--card);border:1px solid var(--line);border-radius:12px;

.auth-input-wrap{position:relative;width:100%;max-width:320px}
.auth-input-wrap input.auth-input{padding-right:46px;padding-left:46px}
.auth-eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;background:none;border:none;
font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mute);opacity:.85;padding:0}
.auth-eye-btn:active{opacity:.6}
.auth-btn{width:100%;max-width:320px;padding:16px;background:linear-gradient(135deg,#00aaff,#0066cc);color:#fff;border:none;
border-radius:12px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(0,140,255,.35);
-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.auth-btn:active{transform:scale(.98)}
.auth-btn:disabled{opacity:.6}
.auth-err{font-size:13px;color:var(--bad);margin:0;max-width:320px}
.auth-note{font-size:13px;color:var(--warn);margin:0;max-width:320px}
.auth-help{font-size:11px;color:#8a90a8;margin:8px 0 0;max-width:300px;line-height:1.5}
.fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-bot));width:58px;height:58px;border-radius:50%;

.card p,.card .t{overflow-wrap:anywhere}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,82vw);gap:10px;overflow-x:auto;

border:1px solid var(--acc);border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;
align-items:center;justify-content:space-between;gap:10px}
#updateBanner.show{display:flex}
#updateBanner .msg{font-size:13px;font-weight:600;color:#fff;border:0;margin:0;padding:0}
#updateBanner .actions{display:flex;gap:8px;flex-shrink:0}
#updateBanner button{border:none;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;min-height:36px}

#updateBanner .btn-refresh{background:var(--acc);color:#04121a}
/* 🧙 How tickets move — demo of the ticket states (2026-10-29, David) */
body.wizzing{overflow:hidden}
#wiz{position:fixed;inset:0;z-index:30;background:rgba(4,6,12,.88);display:none;overflow-y:auto;
padding:calc(var(--safe-top) + 28px) 10px calc(var(--safe-bot) + 16px);-webkit-overflow-scrolling:touch}
#wiz.show{display:block}
.wz-box{max-width:860px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.wz-head{display:flex;align-items:center;gap:8px}
.wz-head h2{flex:1;margin:0;font-size:17px}
.wz-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.wz-t{flex:none;border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;
white-space:nowrap;min-height:36px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wz-t.on{color:var(--bg);background:var(--acc);border-color:var(--acc)}
.wz-split{margin-top:12px}
@media (min-width:760px){.wz-split{display:grid;grid-template-columns:minmax(0,400px) 1fr;gap:14px;align-items:start}}
.wz-svg{width:100%;max-width:400px;display:block;margin:0 auto}
.wz-e{fill:none;stroke:#8a90a8;stroke-width:1.6}
.wz-e.why{stroke:var(--warn);stroke-dasharray:5 4}
.wz-e.hint{stroke:var(--acc);stroke-width:2.4}
.wz-e.hot{stroke:var(--acc);stroke-width:3.2;stroke-dasharray:none}
.wz-n rect{fill:#12141f;stroke:#3a4060;stroke-width:1.5}
.wz-n.hold rect{stroke:var(--warn)}
.wz-n text{fill:#fff;font:600 13px 'Inter',system-ui,sans-serif;pointer-events:none}
.wz-n[data-wz]{cursor:pointer}
.wz-n:focus{outline:none}
.wz-n.sel rect,.wz-n:focus rect{stroke:var(--acc);stroke-width:3}
.wz-n.cur rect{fill:var(--acc);stroke:var(--acc);animation:wzPop .35s ease-out}

@keyframes wzPop{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.wz-n.cur rect{animation:none}}
.wz-legend{font-size:12px;text-align:center;margin:6px 0 0}
.wz-k{display:inline-block;width:22px;border-top:2px solid #8a90a8;vertical-align:middle;margin:0 4px 0 8px}
.wz-k.why{border-top:2px dashed var(--warn)}
.wz-mv{padding:8px 0;border-top:1px solid var(--line)}
.chip.wz-why{color:var(--warn);border-color:var(--warn)}
.wz-reason{border-left:3px solid var(--warn);padding:4px 8px;margin:0 0 8px;overflow-wrap:anywhere}
.wz-dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.wz-dot{width:22px;height:22px;min-height:0;border-radius:50%;border:2px solid var(--acc);background:none;padding:0;cursor:pointer}

.wz-file{margin-top:12px}
.wz-file .card h3{font-size:15px}
.wz-url input{font-size:14px;min-height:40px;padding:8px 10px}
p.wz-url{font-size:13px;overflow-wrap:anywhere;margin:0}

<body>
<!-- ── PWA version badge — same as the Jobs, Remote, HR Admin and HR Portal apps.
     The server fills in the build at serve time (ai_prowler_mcp.py _stamp_pwa_build).
     Tap it: green = latest, red = a newer one is waiting (tap again to load). -->
<style id="apPwaVerCss">
#apPwaVer{position:fixed;top:calc(env(safe-area-inset-top,0px) + 2px);right:4px;z-index:2147483000;
  font:600 10px/1.2 -apple-system,Segoe UI,Roboto,Arial,sans-serif;letter-spacing:.2px;
  padding:2px 6px;border-radius:9px;background:rgba(20,24,40,.72);color:#cfd6e6;
  border:1px solid rgba(255,255,255,.18);cursor:pointer;user-select:none;-webkit-user-select:none;
  white-space:nowrap;opacity:.9;-webkit-tap-highlight-color:transparent}
#apPwaVer.ok{background:#1b5e20;color:#fff;border-color:#2e7d32}
#apPwaVer.old{background:#b71c1c;color:#fff;border-color:#e53935}
#apPwaVer.busy{opacity:.55}
@media print{#apPwaVer{display:none}}
</style>
<div id="apPwaVer" title="App version — tap to check for a newer one" data-app="Service Desk"></div>
<script id="apPwaVerJs">
(function () {
  var BUILD = /*AP_PWA_BUILD*/'__AIPROWLER_PWA_BUILD__'/*AP_PWA_BUILD_END*/;
  var APP_ROOT = '/desk/';
  var el = document.getElementById('apPwaVer');
  if (!el) return;
  var stamped = BUILD.indexOf('__AIPROWLER') !== 0;      // false = file opened without the server
  var label = stamped ? 'v' + BUILD : 'dev build';
  el.textContent = label;
  el.setAttribute('aria-label', el.getAttribute('data-app') + ' app version ' + label);
  window.AIPROWLER_PWA_BUILD = stamped ? BUILD : '';
  var newer = null;
  function serverBuild() {
    return fetch(APP_ROOT + 'index.html?v=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (t) {
        var m = t.match(/\/\*AP_PWA_BUILD\*\/'([^']*)'\/\*AP_PWA_BUILD_END\*\//);
        if (!m) throw new Error('no build stamp');
        return m[1];
      });
  }
  el.addEventListener('click', function (ev) {
    ev.stopPropagation();
    if (newer) {                                        // second tap: load the newer build
      el.textContent = 'updating…';
      var go = function () { location.reload(); };
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
          navigator.serviceWorker.getRegistration().then(function (reg) {
            return reg ? reg.update() : null;
          }).then(go, go);
          return;
        }
      } catch (e) {}
      go();
      return;
    }
    el.className = 'busy';
    el.textContent = label + ' · checking…';
    serverBuild().then(function (srv) {
      if (srv === BUILD) {
        el.className = 'ok';
        el.textContent = label + ' ✓ latest';
      } else {
        newer = srv;
        el.className = 'old';
        el.textContent = label + ' → v' + srv + ' — tap to update';
      }
    }).catch(function () {
      el.className = '';
      el.textContent = label + ' · can\'t reach server';
    }).then(function () {
      if (!newer) setTimeout(function () { el.className = ''; el.textContent = label; }, 6000);
    });
  });
})();
</script>

<script>
'use strict';
const S = { mode: 'personal', token: '', me: null, filter: 'mine', tickets: [], cursor: '',
            open: null, poll: null };
const $ = s => document.querySelector(s);
const app = $('#app');

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, ms || 3500);
}
// 2026-11-02: did a reply actually reach the customer? (Replies failed for days with no sign here.)
function deliveryTag(m) {
  const s = m && m.delivery_status;
  if (!s || m.visibility !== 'public') return '';
  if (s === 'sent') return ' · <span class="dlv ok" style="color:#3fb950">✓ sent</span>';
  if (s === 'queued') return ' · <span class="dlv" style="color:#d29922">⏳ sending</span>';
  if (s === 'no_contact') return ' · <span class="dlv bad" style="color:#f85149;font-weight:600">⚠ no email/phone on file</span>';
  if (s === 'failed') return ' · <span class="dlv bad" style="color:#f85149;font-weight:600" title="The email or text to the customer did not go out — check Settings → Email Configuration">⚠ not delivered</span>';
  return '';
}
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function dueDay(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}
function isLate(t) { return t.due_resolve_at && !['Fixed', 'Closed'].includes(t.state) && new Date(t.due_resolve_at) < new Date(); }

async function api(method, path, body, isForm) {
  const h = { Authorization: 'Bearer ' + S.token };
  if (body && !isForm) h['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch(path, { method, headers: h, body: body ? (isForm ? body : JSON.stringify(body)) : undefined }); }
  catch (e) { setOnline(false); throw new Error('No connection — check your signal and try again.'); }
  setOnline(true);
  if (r.status === 401) { signOut('Please sign in again.'); throw new Error('signed out'); }
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json() : await r.blob();
  if (!r.ok) { const e = new Error((data && data.message) || ('Error ' + r.status)); e.status = r.status; throw e; }
  return data;
}

// ── sign in ────────────────────────────────────────────────────────────────
// ── new-version banner (same rules as the Jobs app) ─────────────────────────
// A new sw.js means a new app build. Ask the browser to check now, whenever the
// app comes back to the front, and every 30 minutes — browsers otherwise check
// only about once a day. "Later" hides it until the next tab change.
let _swReg = null, _updatePending = false;
function initUpdateBanner() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('/desk/sw.js').then(reg => {
    _swReg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner();
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner();
      });
    });
    reg.update().catch(() => {});
  }).catch(() => {});
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && _swReg) _swReg.update().catch(() => {});
  });
  setInterval(() => { if (_swReg) _swReg.update().catch(() => {}); }, 30 * 60 * 1000);
}
function showUpdateBanner() { _updatePending = true; $('#updateBanner').classList.add('show'); }
$('#updLater').addEventListener('click', () => $('#updateBanner').classList.remove('show'));
$('#updNow').addEventListener('click', () => location.reload());

// ── ↻ refresh: reload whatever is on screen ────────────────────────────────
async function refreshNow() {
  const b = $('#refreshBtn'); b.classList.add('spin');
  try {
    if (S.open) await openTicket(S.open.ticket_id);
    else if (S.filter === 'settings') await showSettings();
    else if (S.filter === 'reports') document.querySelector(".tab[data-filter='reports']").click();
    else if (S.filter === 'bookings') await showBookings();
    else if (S.filter === 'agent') await showAgent();
    else await refreshList();
    loadDirectory(true);
  } finally { setTimeout(() => b.classList.remove('spin'), 350); }
}
$('#refreshBtn').addEventListener('click', refreshNow);
$('#signOutBtn').addEventListener('click', () => {
  if (!confirm('Sign out of Service Desk on this device?')) return;
  signOut('Signed out.');
});
function setOnline(on) { const d = $('#connDot'); d.classList.toggle('offline', !on); d.title = on ? 'Connected' : 'Offline — changes will not save'; }
window.addEventListener('online', () => setOnline(true));
window.addEventListener('offline', () => setOnline(false));

async function boot() {
  initUpdateBanner(); setOnline(navigator.onLine !== false);
  try { S.mode = (await (await fetch('/pwa-token')).json()).mode || 'personal'; } catch (_) {}
  S.token = sessionStorage.getItem('desk_token') || '';
  if (S.token) { try { await start(); return; } catch (_) {} }
  showLogin();
}
function showLogin(note) {
  stopPoll(); $('#tabs').classList.add('hide'); $('#fab').classList.add('hide'); $('#who').textContent = '';
  ['#refreshBtn', '#signOutBtn', '#bell'].forEach(s => $(s).classList.add('hide'));
  const server = S.mode === 'server';
  document.body.classList.add('authing');
  // Same sign-in screen as the Jobs app: logo, title, password box with a 👁️ to
  // show what you typed, blue Unlock button, the problem shown right under it.
  app.innerHTML = `<div class="auth-screen" id="authScreen">
    <img class="auth-logo" src="/desk/icon-192.png" alt="AI-Prowler">
    <h1 class="auth-title">AI-Prowler</h1>
    <p class="auth-app">SERVICE DESK</p>
    <p class="auth-sub">${server ? 'Enter your name and password from AI-Prowler → Admin.'
      : 'Enter your Bearer Token from AI-Prowler Settings → Remote Access.'}</p>
    ${note ? `<p class="auth-note">${esc(note)}</p>` : ''}
    ${server ? '<input id="lgName" class="auth-input" type="text" placeholder="Your name" maxlength="128" autocomplete="username">' : ''}
    <div class="auth-input-wrap">
      <input id="lgTok" class="auth-input" type="password" placeholder="${server ? 'Password' : 'Bearer Token'}" maxlength="256" autocomplete="current-password">
      <button type="button" id="lgEye" class="auth-eye-btn" aria-label="Show password" tabindex="-1">&#x1F441;&#xFE0F;</button>
    </div>
    <button class="auth-btn" id="lgGo">&#x1F513; Unlock</button>
    <p class="auth-err hide" id="lgErr"></p>
    <p class="auth-help">💡 ${server ? 'Your owner gives you your name and password.'
      : 'Find your token in AI-Prowler → Settings → Remote Access → Bearer Token → Show'}</p>
  </div>`;
  const clearErr = () => { $('#lgTok').classList.remove('invalid'); $('#lgErr').classList.add('hide'); };
  $('#lgGo').addEventListener('click', doLogin);
  $('#lgTok').addEventListener('input', clearErr);
  $('#lgTok').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  if (server) $('#lgName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#lgTok').focus(); });
  $('#lgEye').addEventListener('click', () => {
    const inp = $('#lgTok'), btn = $('#lgEye'), show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.innerHTML = show ? '&#x1F648;' : '&#x1F441;&#xFE0F;';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
}
function loginError(msg) {
  const e = $('#lgErr'); if (!e) { toast(msg); return; }
  e.textContent = msg; e.classList.remove('hide'); $('#lgTok').classList.add('invalid');
}
async function doLogin() {
  const tok = $('#lgTok').value.trim();
  if (!tok) { loginError(S.mode === 'server' ? 'Enter your password.' : 'Enter your Bearer Token.'); return; }
  const go = $('#lgGo'); go.disabled = true;
  try {
    if (S.mode === 'server') {
      const r = await fetch('/desk-api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: $('#lgName').value.trim(), token: tok }) });
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.message || 'Name or password not recognized.');
      S.token = d.access_token;
    } else {
      const r = await fetch('/pwa-verify', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: tok }) });
      if (!r.ok) throw new Error('That token is not right.');
      S.token = tok;
    }
    sessionStorage.setItem('desk_token', S.token);
    document.body.classList.remove('authing');
    await start();
  } catch (e) {
    if (!$('#lgTok')) showLogin();
    document.body.classList.add('authing');
    loginError(e.message);
  } finally { if (go.isConnected) go.disabled = false; }
}
function signOut(note) { sessionStorage.removeItem('desk_token'); S.token = ''; showLogin(note); }

async function start() {
  S.me = await api('GET', '/desk-api/me');
  const a = S.me.actor;
  $('#who').textContent = ' · ' + (a.name || a.id) + ' · ' + (S.me.edition === 'solo' ? 'Solo' : a.role.replace('_', ' '));
  $('#tabs').classList.remove('hide'); $('#fab').classList.remove('hide');
  $('#refreshBtn').classList.remove('hide'); $('#signOutBtn').classList.remove('hide');
  // 2026-10-30 (David): on a server (Business) there's no Settings tab — the owner sets
  // Service Desk up in AI-Prowler → 🏢 Small Business tab. Personal (Solo) keeps it.
  $('#tabSettings').classList.toggle('hide', a.role !== 'owner' || S.me.edition !== 'solo');
  $('#tabReports').classList.toggle('hide', !['owner', 'manager'].includes(a.role));
  // 📅 To approve (booking-spec.md §7a): only approvers — the owner, and managers on a server
  // when allowed — and only when "Book a service" is on.
  $('#tabBookings').classList.toggle('hide', !S.me.can_approve_bookings);
  if (S.me.can_approve_bookings) bookingCount();
  // 🤖 Agent (desk_agent.py): what the assistant suggested, for the owner and managers.
  $('#tabAgent').classList.toggle('hide', !(['owner', 'manager'].includes(a.role) && S.me.settings && S.me.settings.agent_enabled));
  $('#bell').classList.toggle('hide', !('serviceWorker' in navigator && 'PushManager' in window));
  await refreshList(); startPoll(); loadDirectory();
}

// ── list views ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); S.filter = b.dataset.filter; S.open = null;
  if (_updatePending) showUpdateBanner();               // "Later" only hides it until the next tab
  window.scrollTo(0, 0);
  if (S.filter === 'settings') showSettings();
  else if (S.filter === 'reports') showReports();
  else if (S.filter === 'bookings') showBookings();
  else if (S.filter === 'agent') showAgent();
  else refreshList();
}));
$('#fab').addEventListener('click', showNew);

// ── web push: alerts on this phone even when the app is closed ──────────────
function b64ToBytes(s) {
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
$('#bell').addEventListener('click', async () => {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (ios && !standalone) { toast('On iPhone, first tap Share → Add to Home Screen, then open Service Desk from the home screen and tap 🔔.', 8000); return; }
  try {
    if ((await Notification.requestPermission()) !== 'granted') { toast('Alerts are blocked for this app in the phone settings.'); return; }
    const reg = await navigator.serviceWorker.ready;
    const key = (await api('GET', '/desk-api/push/key')).key;
    const sub = (await reg.pushManager.getSubscription()) ||
      await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
    await api('POST', '/desk-api/push/subscribe', { subscription: sub.toJSON() });
    toast('Alerts are on for this phone.');
  } catch (e) { toast('Could not turn on alerts: ' + e.message); }
});

function query() {
  switch (S.filter) {
    case 'mine': return '?open_only=1&mine=1';
    case 'overdue': return '?overdue=1';
    case 'closed': return '?state=Closed';
    default: return '?open_only=1';
  }
}
async function refreshList() {
  try {
    const d = await api('GET', '/desk-api/tickets' + query());
    S.tickets = d.tickets;
    S.cursor = d.cursor || S.cursor;
  } catch (e) { if (e.message !== 'signed out') toast(e.message); return; }
  S.filter === 'board' ? renderBoard() : renderList();
}
// How long an open ticket has been waiting since it was filed (2026-10-28, David):
// "waiting 2d" on every card, red once it's past its due date — at a glance,
// who has waited longest. Fixed / Closed tickets aren't waiting on you.
function waited(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  if (!iso || isNaN(ms)) return '';
  const m = Math.max(0, Math.floor(ms / 60000));
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  return h < 48 ? h + 'h' : Math.floor(h / 24) + 'd';
}
function card(t) {
  const late = isLate(t), open = !['Fixed', 'Closed'].includes(t.state), w = open ? waited(t.created_at) : '';
  return `<button class="card tk" data-open="${esc(t.ticket_id)}">
    <div class="id">${esc(t.ticket_id)} · ${esc(t.kind === 'external' ? 'customer' : t.kind)}${t.assignee ? ' · ' + esc(t.assignee) : ''}</div>
    <div class="t">${esc(t.title)}</div>
    <div class="chips"><span class="chip st">${esc(t.state)}</span><span class="chip ${esc(t.priority)}">${esc(t.priority)}</span>
    ${w ? `<span class="chip wait ${late ? 'late' : ''}" title="Filed ${esc(when(t.created_at))}">⏱ waiting ${w}</span>` : ''}
    ${t.due_resolve_at && open ? `<span class="chip ${late ? 'late' : ''}">due ${esc(dueDay(t.due_resolve_at))}</span>` : ''}
    ${t.csat_score != null ? `<span class="chip csat" title="Customer rating">★ ${esc(t.csat_score)}/5</span>` : ''}</div>
  </button>`;
}
function stars(n) { n = Math.max(0, Math.min(5, +n || 0)); return '★'.repeat(n) + '☆'.repeat(5 - n); }
function renderList() {
  const empty = { mine: 'Nothing on your plate.', open: 'No open tickets.', overdue: 'Nothing overdue.',
                  closed: 'No closed tickets yet.' }[S.filter];
  app.innerHTML = S.tickets.length ? S.tickets.map(card).join('') : `<p class="muted">${empty}</p>`;
}
function renderBoard() {
  const cols = S.me.states.filter(s => s !== 'Closed');
  app.innerHTML = `<p class="muted" style="margin-top:0">Drag a card to another column to move it.</p>
    <div class="board">${cols.map(s => `<div class="col" data-col="${esc(s)}"><h3>${esc(s)} (${S.tickets.filter(t => t.state === s).length})</h3>
    ${S.tickets.filter(t => t.state === s).map(card).join('') || '<p class="muted">—</p>'}</div>`).join('')}</div>`;
  app.querySelectorAll('.board .tk').forEach(c => {
    c.draggable = true;
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.open); });
  });
  app.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.style.outline = '2px dashed var(--acc)'; });
    col.addEventListener('dragleave', () => { col.style.outline = ''; });
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.style.outline = '';
      const t = S.tickets.find(x => x.ticket_id === e.dataTransfer.getData('text/plain'));
      const to = col.dataset.col;
      if (!t || t.state === to) return;
      if (!(S.me.transitions[t.state] || []).includes(to)) { toast(`Can't move from ${t.state} to ${to}.`); return; }
      let reason = '';
      if (needsReason(t.state, to)) { reason = prompt(`Reason for moving to ${to}?`) || ''; if (!reason.trim()) return; }
      try {
        await api('POST', `/desk-api/tickets/${t.ticket_id}/state`, { to_state: to, reason, expected_version: t.version });
        toast(`${t.ticket_id} → ${to}`);
      } catch (err) { toast(err.status === 409 ? 'Someone else just changed it — refreshed.' : err.message); }
      refreshList();
    });
  });
}

// ── reports (owner, managers) ──────────────────────────────────────────────
async function showReports(days) {
  days = days || 30;
  const since = new Date(Date.now() - days * 864e5).toISOString().slice(0, 10);
  const group = S.me.edition === 'business' ? 'assignee' : 'type';
  let d;
  try { d = await api('GET', `/desk-api/report?since=${since}&group_by=${group}`); } catch (e) { toast(e.message); return; }
  const row = (k, s) => `<tr><td>${esc(k)}</td><td>${s.tickets}</td><td>${s.open}</td><td>${s.closed}</td>
    <td>${s.median_first_response_min ?? '—'}</td><td>${s.median_resolution_hours ?? '—'}</td><td>${s.sla_breaches}</td>
    <td>${s.csat_avg ?? '—'}</td></tr>`;
  app.innerHTML = `<div class="card"><div class="row">${[7, 30, 90].map(n => `<button class="b ${n === days ? '' : 'ghost'}" data-days="${n}">${n} days</button>`).join('')}</div>
    <div style="overflow-x:auto"><table style="width:100%;margin-top:12px;font-size:13px;border-collapse:collapse">
    <tr class="muted"><th align="left">${group === 'assignee' ? 'Person' : 'Type'}</th><th>Tickets</th><th>Open</th><th>Closed</th>
    <th>First reply (min)</th><th>Fix (h)</th><th>SLA misses</th><th>Rating</th></tr>
    ${row('All', d.report.total)}${Object.entries(d.report.groups || {}).map(([k, s]) => row(k, s)).join('')}</table></div></div>`;
  app.querySelectorAll('[data-days]').forEach(b => b.addEventListener('click', () => showReports(+b.dataset.days)));
}

async function download(path, filename) {
  try {
    const blob = await api('GET', path);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  } catch (e) { toast(e.message); }
}
app.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) { e.preventDefault(); openTicket(o.dataset.open); }
});

// ── live updates (30 s) ────────────────────────────────────────────────────
// ── 📅 To approve: bookings from the website (booking-spec.md §7a) ─────────
// ✅ Approve (the customer's time, a backup, or any open time) · ↔ Suggest another time ·
// ✖ Decline. Nothing is booked until an approver decides (unless the owner turned approval off).
async function bookingCount() {
  try {
    const d = await api('GET', '/desk-api/bookings');
    const n = d.bookings.filter(b => b.status !== 'suggested').length;

function startPoll() { stopPoll(); S.poll = setInterval(pollOnce, 30000); }
function stopPoll() { if (S.poll) clearInterval(S.poll); S.poll = null; }
async function pollOnce() {
  if (!S.token || document.hidden) return;
  try {
    const u = await api('GET', '/desk-api/updates?since=' + encodeURIComponent(S.cursor || ''));
    S.cursor = u.cursor || S.cursor;
    if (!u.tickets.length) return;
    if (S.open) {
      const mine = u.tickets.find(t => t.ticket_id === S.open.ticket_id);
      if (mine && mine.version !== S.open.rev && !$('#changed')) {
        const b = document.createElement('div');
        b.className = 'banner'; b.id = 'changed'; b.textContent = 'This ticket was just changed — tap to reload.';
        b.addEventListener('click', () => openTicket(S.open.ticket_id));
        app.prepend(b);
      }
    } else if (S.filter === 'bookings') { bookingCount(); }          // never redraw a half-made choice
    else if (S.filter === 'agent') { /* the reviewer may be mid-edit — ↻ reloads */ }
    else if (S.filter !== 'settings') { refreshList(); if (S.me && S.me.can_approve_bookings) bookingCount(); }
  } catch (_) {}
}

    try {

      try { await navigator.clipboard.writeText(d.url); toast('Status link copied.'); }
      catch (_) { prompt('Status link:', d.url); }
    } catch (e) { toast(e.message); }
  });
  if ($('#redo')) $('#redo').addEventListener('click', async () => {
    const day = prompt('Re-do date (YYYY-MM-DD)?'); if (!day) return;
    let cust = t.customer_id || '';
    if (!cust) { cust = prompt('Jobs app customer id (CUST-####)?') || ''; if (!cust) return; }
    try {

// ── address book + watchers (2026-10-28) ───────────────────────────────────
// One list of every address the team may pick from — team, my saved contacts,
// Jobs customers, past ticket contacts — offered as people type.
async function loadDirectory(force) {
  if (!S.me || (S.dir && !force) || S.me.actor.role === 'customer' || S.me.actor.role === 'subcontractor') return;
  try { S.dir = await api('GET', '/desk-api/directory'); } catch (_) { S.dir = { entries: [], team: [] }; }
  const make = (id, opts) => { let d = document.getElementById(id);
    if (!d) { d = document.createElement('datalist'); d.id = id; document.body.appendChild(d); }
    d.innerHTML = opts; };
  make('dlEmail', S.dir.entries.map(e => `<option value="${esc(e.email)}">${esc((e.name ? e.name + ' · ' : '') + e.source)}</option>`).join(''));
  make('dlTeam', (S.dir.team || []).map(u => `<option value="${esc(u.id)}">${esc(u.name + ' · ' + u.role + (u.email ? ' · ' + u.email : ''))}</option>`).join(''));
}
function dirEntry(v) {
  const x = (v || '').trim().toLowerCase(); if (!x || !S.dir) return null;
  return S.dir.entries.find(e => e.email === x) || S.dir.entries.find(e => e.name.toLowerCase() === x) || null;
}
function canEditWatchers(t) {
  const a = S.me.actor; return a.role === 'owner' || a.role === 'manager' || t.assignee === a.id;
}
function watchersCard(t) {
  if (!Array.isArray(t.watchers)) return '';                 // outside parties never get the list
  const me = (S.me.actor.email || '').toLowerCase(), edit = canEditWatchers(t);
  const watching = t.watchers.some(w => w.email === me);
  return `<div class="card" id="wCard"><h3 style="margin:0 0 6px">Watchers <span class="muted" style="font-size:12px;font-weight:400">— emailed on every change of state</span></h3>
    <div id="wList">${t.watchers.map(w => `<span class="chip" data-watcher="${esc(w.email)}">${esc(w.name ? w.name + ' <' + w.email + '>' : w.email)}
      ${edit || w.email === me ? `<a href="#" data-wrm="${esc(w.email)}" title="Remove" style="margin-left:4px">✕</a>` : ''}</span>`).join(' ') || '<span class="muted">Nobody yet.</span>'}</div>
    ${edit ? `<div class="row" style="margin-top:8px"><input id="wEmail" list="dlEmail" placeholder="name or email — start typing">
      <button class="b ghost" id="wAdd" style="flex:0">Add</button></div>` : ''}
    ${!edit && me ? `<div class="row" style="margin-top:8px"><button class="b ghost" id="wMe">${watching ? 'Stop watching' : '👁 Watch this ticket'}</button></div>` : ''}</div>`;
}
function wireWatchers(t) {
  if (!$('#wCard')) return;
  const send = async (email, name, remove) => {
    try { await api('POST', `/desk-api/tickets/${t.ticket_id}/watchers`, { email, name, remove: !!remove });
          toast(remove ? 'Removed.' : 'Added — they\'ll be emailed when it changes.'); openTicket(t.ticket_id); }
    catch (e) { toast(e.message); }
  };
  if ($('#wAdd')) $('#wAdd').addEventListener('click', () => {
    const v = $('#wEmail').value.trim(); if (!v) return;
    const hit = dirEntry(v);
    if (!hit && !v.includes('@')) { toast('No email on file for that name — type the address.'); return; }
    send(hit ? hit.email : v, hit ? hit.name : '', false);
  });
  if ($('#wMe')) $('#wMe').addEventListener('click', () => {
    const me = S.me.actor.email, on = t.watchers.some(w => w.email === me.toLowerCase());
    send(me, S.me.actor.name || '', on);
  });
  app.querySelectorAll('[data-wrm]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); send(a.dataset.wrm, '', true); }));
}
function needsReason(from, to) { return S.me.needs_reason.some(p => p[0] === from && p[1] === to); }
async function move(t, to) {
  let reason = '';
  if (needsReason(t.state, to)) {
    reason = prompt(`Reason for moving to ${to}?`) || '';
    if (!reason.trim()) { toast('A reason is needed for that move.'); return; }
  } else if (to === 'Closed' && !confirm('Close this ticket?')) { return; }
  post(t, 'state', { to_state: to, reason });
}
async function post(t, action, body) {
  try {
    await api('POST', `/desk-api/tickets/${t.ticket_id}/${action}`, { ...body, expected_version: t.rev });
    toast('Saved.'); openTicket(t.ticket_id);
  } catch (e) {
    if (e.status === 409) { toast('Someone else changed this ticket — reloading.'); openTicket(t.ticket_id); }
    else toast(e.message);
  }
}
async function sendMessage(t, body, visibility) {
  try { await api('POST', `/desk-api/tickets/${t.ticket_id}/messages`, { body, visibility }); openTicket(t.ticket_id); }
  catch (e) { toast(e.message); }
}
async function upload(t, files) {
  if (!files || !files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('file', f, f.name);
  fd.append('visibility', $('#attInternal') && $('#attInternal').checked ? 'internal' : 'public');
  toast('Uploading…', 60000);
  try { await api('POST', `/desk-api/tickets/${t.ticket_id}/attachments`, fd, true); toast('Uploaded.'); openTicket(t.ticket_id); }
  catch (e) { toast(e.message); }
}
async function loadThumbs() {
  for (const a of app.querySelectorAll('[data-att]')) {
    a.addEventListener('click', async e => {
      e.preventDefault();
      try {
        const blob = await api('GET', '/desk-api/attachments/' + a.dataset.att);
        const url = URL.createObjectURL(blob); window.open(url, '_blank');
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (err) { toast(err.message); }
    });
    if (a.dataset.thumb === '1') {
      try {
        const blob = await api('GET', '/desk-api/attachments/' + a.dataset.att + '?thumb=1');
        a.innerHTML = `<img alt="${esc(a.dataset.name)}" src="${URL.createObjectURL(blob)}">`;
      } catch (_) {}
    }
  }
}

      <label id="nPartyLbl">Customer name</label><input id="nName">
      <div class="row"><div><label id="nPhoneLbl">Phone</label><input id="nPhone" type="tel"></div><div><label>Email</label><input id="nEmail" type="email" list="dlEmail" placeholder="start typing — picks from your contacts"></div></div>
      <div id="nJobRow"><label>Job id (optional)</label><input id="nJob"></div></div>
    <div id="nBook" class="hide"></div>
    <div id="nTicketOpts"><div class="row"><div><label>Priority</label><select id="nPri"><option>P3</option><option>P1</option><option>P2</option><option>P4</option></select></div>
      <div><label>Due</label><input id="nDue" type="date"></div></div>
    <label><input type="checkbox" id="nSms" style="width:auto"> Also alert by text (SMS)</label></div>
    <div class="row" style="margin-top:12px"><button class="b" id="nGo">File ticket</button></div></div>`;
  const need = () => ($('#nKind').value === 'external' && S.me.can_book_for_customers) ? $('#nNeed').value : 'ticket';
  const syncNeed = () => {
    const n = need(), booking = n !== 'ticket';
    $('#nTitleRow').classList.toggle('hide', booking);
    $('#nJobRow').classList.toggle('hide', booking);
    $('#nTicketOpts').classList.toggle('hide', booking);
    $('#nBook').classList.toggle('hide', !booking);
    $('#nPhoneLbl').textContent = booking ? 'Phone (required)' : 'Phone';
    $('#nGo').textContent = n === 'book' ? 'Book the visit' : n === 'new' ? 'File the request' : 'File ticket';
    if (booking) drawBookPanel(n);
  };
  const syncKind = () => {
    const k = $('#nKind').value;
    $('#nParty').classList.toggle('hide', k === 'internal');
    $('#nPartyLbl').textContent = k === 'subcontractor' ? 'Subcontractor name' : 'Customer name';
    $('#nViaRow').classList.toggle('hide', k !== 'external');
    $('#nNeedRow').classList.toggle('hide', !(k === 'external' && S.me.can_book_for_customers));
    syncNeed();
  };
  $('#nKind').addEventListener('change', syncKind);
  $('#nNeed').addEventListener('change', syncNeed);
  syncKind();
  $('#nEmail').addEventListener('change', () => {          // picked from the list: fill the rest
    const hit = dirEntry($('#nEmail').value);
    if (!hit) return;
    if (!$('#nName').value.trim() && hit.name) $('#nName').value = hit.name;
    if (!$('#nPhone').value.trim() && hit.phone) $('#nPhone').value = hit.phone;
  });
  $('#back').addEventListener('click', () => refreshList());
  $('#nGo').addEventListener('click', async () => {
    const k = $('#nKind').value;
    if (need() !== 'ticket') { submitBooking(need()); return; }
    const body = { kind: k, title: $('#nTitle').value.trim(), description: $('#nDesc').value.trim(),
      priority: $('#nPri').value, due: $('#nDue').value, sms_fallback: $('#nSms').checked };
    if (k !== 'internal') Object.assign(body, { contact_name: $('#nName').value.trim(),
      contact_phone: $('#nPhone').value.trim(), contact_email: $('#nEmail').value.trim(), job_id: $('#nJob').value.trim() });
    if (k === 'external') body.source = $('#nVia').value;
    if (!body.title) { toast('Give the ticket a title.'); return; }
    if (k !== 'internal' && !body.contact_phone && !body.contact_email) {

      openTicket(d.ticket.ticket_id);
    }
    catch (e) { toast(e.message); }
  });
}

// ── + → Customer request → Book a visit / New service request (booking-spec.md §9.2) ──
// The same booking the website makes (job + ticket + status link); phone required.
const NEED = [['ticket', 'Report a problem / anything else'], ['book', 'Book a visit'],
  ['new', 'New service request (we call to schedule)']];
async function drawBookPanel(n) {
  const box = $('#nBook');
  if (!S.bookOpts) {
    box.innerHTML = '<p class="muted">Loading services…</p>';
    try { S.bookOpts = await api('GET', '/desk-api/book'); }
    catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  }
  const o = S.bookOpts;
  if (box.dataset.mode === n) return;                          // keep what's typed when re-shown
  box.dataset.mode = n;
  const svcOpts = o.services.map(x => `<option value="${esc(x.code)}">${esc(x.name)}${x.online ? '' : ' (not online)'}</option>`).join('');
  const crews = o.crews.length && o.crew_mode !== 'office';
  box.innerHTML = `
    <label>Service</label><select id="bSvc">${n === 'new' ? '<option value="">Something else (describe in Details)</option>' : ''}${svcOpts}</select>
    ${n === 'new' ? '<input id="bSvcText" placeholder="Which service? (if it isn\'t in the list)" style="margin-top:6px">' : ''}
    <label>Service address</label><input id="bStreet" placeholder="Street">
    <div class="row"><div><input id="bCity" placeholder="City"></div><div style="max-width:70px"><input id="bState" placeholder="State" maxlength="20"></div><div style="max-width:100px"><input id="bZip" placeholder="ZIP" maxlength="10"></div></div>
    ${n === 'book' ? `
    <label>Arrival window</label><div class="row"><div><select id="bWin"><option value="">Pick a service first</option></select></div>
      <div style="max-width:150px"><input id="bFrom" type="date" title="Show times from this date"></div></div>
    ${o.can_override ? `<label style="display:block;color:var(--ink);margin:6px 0"><input type="checkbox" id="bCustomOn" style="width:auto"> Another date &amp; time (outside the open times)</label>
    <div id="bCustom" class="hide row"><div><input id="bDate" type="date"></div><div><input id="bStart" type="time" value="08:00"></div><div><input id="bEnd" type="time" value="10:00"></div></div>` : ''}
    ${crews ? `<label>Crew</label><select id="bCrew"><option value="">${o.crew_mode === 'suggested' ? 'Suggested crew' : 'Best fit'}</option>${o.crews.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>` : ''}`
    : '<label>Preferred days / times</label><input id="bPref" placeholder="e.g. weekday mornings">'}
    <label style="display:block;color:var(--ink);margin:8px 0 0"><input type="checkbox" id="bNotify" style="width:auto" ${o.notify ? 'checked' : ''}> Send the customer a confirmation (with their status link)</label>
    <p class="muted" style="font-size:13px;margin:6px 0 0">${n === 'book' ? (o.confirms_at_once ? 'Confirmed as you book it.' : 'It waits in 📅 To approve; the time is held meanwhile.') : 'It goes to the Jobs app as a Requested job, with a ticket.'}${o.area_note ? ' ' + esc(o.area_note) + '.' : ''}</p>`;
  if (n !== 'book') return;
  const loadWins = async () => {
    const sel = $('#bWin'), code = $('#bSvc').value;
    if (!code) return;
    sel.innerHTML = '<option value="">Loading…</option>';
    try {
      const q = '?service=' + encodeURIComponent(code) + ($('#bFrom').value ? '&from=' + $('#bFrom').value : '');
      const w = (await api('GET', '/desk-api/book/windows' + q)).windows;
      sel.innerHTML = w.length ? w.map(x => `<option value="${esc(x.key)}">${esc(x.label)}</option>`).join('')
        : '<option value="">No open times — try a later date' + (o.can_override ? ' or another date & time' : '') + '</option>';
    } catch (e) { sel.innerHTML = `<option value="">${esc(e.message)}</option>`; }
  };
  $('#bSvc').addEventListener('change', loadWins);
  $('#bFrom').addEventListener('change', loadWins);
  if ($('#bCustomOn')) $('#bCustomOn').addEventListener('change', () => {
    const on = $('#bCustomOn').checked;
    $('#bCustom').classList.toggle('hide', !on); $('#bWin').disabled = on;
  });
  loadWins();
}
async function submitBooking(n) {
  const v = id => ($(id) ? $(id).value.trim() : '');
  const body = { path: n, name: v('#nName'), phone: v('#nPhone'), email: v('#nEmail'), description: v('#nDesc'),
    source: $('#nVia').value, address: { street: v('#bStreet'), city: v('#bCity'), state: v('#bState'), zip: v('#bZip') },
    service_code: v('#bSvc'), notify: !!($('#bNotify') && $('#bNotify').checked) };
  if (!body.name) { toast("Enter the customer's name."); return; }
  if (!body.phone) { toast("Enter the customer's phone number — it's needed so the team can call them."); return; }
  if (!body.address.street || !(body.address.city || body.address.zip)) { toast('Enter the service address (street, and city or ZIP).'); return; }
  if (n === 'new') {
    body.service = v('#bSvcText') || ($('#bSvc').selectedOptions[0] && $('#bSvc').value ? $('#bSvc').selectedOptions[0].textContent : '');
    body.preferred = v('#bPref');
    if (!body.service_code && !body.service) { toast('Say which service they want.'); return; }
  } else {
    if (!body.service_code) { toast('Pick a service.'); return; }
    if ($('#bCustomOn') && $('#bCustomOn').checked) body.custom = { date: v('#bDate'), start: v('#bStart'), end: v('#bEnd') };
    else { body.window_key = v('#bWin'); if (!body.window_key) { toast('Pick an arrival window.'); return; } }
    if ($('#bCrew')) body.crew = v('#bCrew');
  }
  const go = $('#nGo'); go.disabled = true;
  try {
    const d = await api('POST', '/desk-api/book', body);
    const what = d.booking ? (d.booking.status === 'scheduled' ? `Booked ${d.booking.label}` : `Holding ${d.booking.label} for approval`) : 'Request filed';
    toast(`${what} — ${d.ticket_id}` + (d.warnings && d.warnings.length ? ' · ' + d.warnings.join(' ') : ''));
    S.bookOpts = null;
    if (S.me.can_approve_bookings) bookingCount();
    openTicket(d.ticket_id);
  } catch (e) { toast(e.message); go.disabled = false; }
}

// The ticket flow with the agent's steps lit up (2026-10-30). The model comes from
// desk_agent_settings.flow() — the same one AI-Prowler's Business tab draws — so the
// two pictures always match. Hover (or long-press) a box for what it does.
function renderAgentFlow(f, id = 'agFlow', what = 'ticket') {
  // 2026-10-30 fix (David's screenshot): in the dark theme the state boxes were white with
  // light text. Boxes now have no solid fill — a faint tint of their colour when lit and the
  // page's own text colour — so they read in light and dark. Each 🤖 step is coloured by its
  // own Off / Suggest / Auto choice; practice mode adds a purple dashed ring + "practice".
  const box = $('#' + id); if (!box || !f) return;
  const PURPLE = '#7c3aed';
  const arrow = c => `url(#${id}Arr${c.replace('#', '')})`;
  const colors = [...new Set(f.edges.map(e => e.color))];
  const defs = colors.map(c => `<marker id="${id}Arr${c.replace('#', '')}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('');
  const edges = f.edges.map(e => `<line x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}" stroke="${e.color}" stroke-width="${e.kind === 'step' && !e.dash ? 2.5 : 1.5}"
    ${e.dash ? 'stroke-dasharray="4 3"' : ''} marker-end="${arrow(e.color)}" ${e.both ? `marker-start="${arrow(e.color)}"` : ''}/>`).join('');
  const states = f.states.map(st => `<g class="agState" data-state="${esc(st.id)}" data-lit="${st.lit ? 1 : 0}"><title>${esc(st.label)}</title>
    <rect x="${st.x}" y="${st.y}" width="${st.w}" height="${st.h}" rx="16" fill="${st.color}" fill-opacity="${st.lit ? 0.22 : 0}"
      stroke="${st.color}" stroke-width="${st.lit ? 2.5 : 1}"/>
    <text x="${st.x + st.w / 2}" y="${st.y + st.h / 2 + 4}" text-anchor="middle" font-size="12" font-weight="${st.lit ? 700 : 400}" fill="currentColor">${esc(st.label)}</text></g>`).join('');
  const steps = f.steps.map(p => {
    const dim = p.mode === 'off' || p.mode === 'inactive';
    const ring = p.practice ? `<rect x="${p.x - 4}" y="${p.y - 4}" width="${p.w + 8}" height="${p.h + 8}" rx="11" fill="none" stroke="${PURPLE}" stroke-width="1.5" stroke-dasharray="5 3"/>` : '';
    return `<g class="agStep" data-step="${esc(p.id)}" data-chosen="${esc(p.chosen)}" style="cursor:help"><title>${esc(p.label + ' — ' + p.word + (p.practice ? ' (practice mode: shows only)' : '') + '\n\n' + p.help)}</title>
    ${ring}<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8" fill="${p.color}" fill-opacity="${dim ? 0.06 : 0.2}"
      stroke="${p.color}" stroke-width="${p.mode === 'off' ? 1 : dim ? 1.5 : 2.5}" ${dim ? 'stroke-dasharray="4 3"' : ''}/>
    <text x="${p.x + p.w / 2}" y="${p.y + 17}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${esc(p.label)}</text>
    <text x="${p.x + p.w / 2}" y="${p.y + 32}" text-anchor="middle" font-size="11" font-weight="600" fill="${p.color}">${esc(p.word)}</text>
    ${p.practice ? `<text x="${p.x + p.w / 2}" y="${p.y + 46}" text-anchor="middle" font-size="10" font-style="italic" fill="currentColor">practice</text>` : ''}</g>`;
  }).join('');
  const noun = what === 'booking' ? 'booking' : what === 'job' ? 'job' : what === 'route' ? 'week of routes' : what === 'employee' ? 'employee' : 'ticket';
  box.innerHTML = `<div class="muted" style="font-size:12px;margin-bottom:4px">How ${/^[aeiou]/.test(noun) ? 'an' : 'a'} ${noun} moves — the top and bottom boxes are the agent's steps (hover or long-press for details)</div>
    <svg viewBox="-6 -6 ${f.w + 12} ${f.h + 12}" role="img" aria-label="${noun[0].toUpperCase() + noun.slice(1)} flow with the agent's steps" style="width:100%;height:auto;display:block"><defs>${defs}</defs>${edges}${states}${steps}</svg>
    <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin:6px 0">${f.legend.map(([m, c, w]) =>
      `<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;${m === 'practice' ? `border:1.5px dashed ${c}` : `background:${c}`};margin-right:4px"></span>${esc(w)}</span>`).join('')}</div>
    <p id="${id}Summary" style="font-size:13px;margin:0">${esc(f.summary)}</p>`;
}

// ── Settings → Data: export, import, backups ───────────────────────────────
async function renderDataSection() {
  let b;
  try { b = await api('GET', '/desk-api/backups'); } catch (e) { toast(e.message); return; }
  const st = b.settings, H = b.help || {};
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2 style="margin:0 0 6px">Data</h2>
    <label>Export</label><div class="row">
      <button class="b ghost" data-exp="xlsx">Excel</button><button class="b ghost" data-exp="csv">CSV</button>
      <button class="b ghost" data-exp="json">Full (moves to another Service Desk)</button></div>
    <label>Import (.csv, .xlsx or a full export .zip)</label>
    <input type="file" id="impFile" accept=".csv,.xlsx,.zip">
    <div class="row" style="margin-top:8px"><button class="b ghost" id="impDry">Check file (dry run)</button>
      <button class="b hide" id="impGo">Import now</button></div>
    <pre id="impOut" class="muted" style="white-space:pre-wrap"></pre>
    <div class="row"><input id="undoId" placeholder="Batch id to undo (IMP-…)"><button class="b ghost" id="undoGo" style="flex:0">Undo import</button></div>
    <label>Backups</label>
    <p class="muted" id="bkFolder" style="font-size:13px;margin:0 0 6px" title="${esc(H.backup_dir || '')}">Saved in <b>${esc(b.folder || '')}</b>
      — change the folder in AI-Prowler on this PC (🏢 Small Business tab → Service Desk → Data &amp; backups).</p>
    <div class="row"><button class="b" id="bkNow">Back up now</button></div>
    <div id="bkList" style="margin-top:8px">${b.backups.slice(0, 15).map(x => `<div class="tog" style="flex-wrap:wrap">
      <span style="flex:1">${esc(x.made_at.replace('T', ' ').slice(0, 16))} · ${esc(x.trigger)} · ${Math.max(1, Math.round(x.bytes / 1024))} KB · ${x.verified ? '✔ verified' : '⚠ not verified'}</span>
      <button class="b ghost" data-dl="${esc(x.name)}" style="flex:0">Download</button>

    <label>Automatic backups</label>
    <div class="tog"><input type="checkbox" id="bkOn" ${st.backup_enabled ? 'checked' : ''}><span>On</span></div>
    <div class="row"><div><label title="${esc(H.backup_frequency || '')}">How often</label><select id="bkFreq" title="${esc(H.backup_frequency || '')}">${['hourly', 'daily', 'weekly'].map(f => `<option ${st.backup_frequency === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
      <div><label title="${esc(H.backup_hour || '')}">At hour (0-23)</label><input id="bkHour" type="number" min="0" max="23" value="${st.backup_hour}"></div></div>
    <div class="row"><div><label title="${esc(H.backup_keep_daily || '')}">Keep daily</label><input id="bkD" type="number" min="1" value="${st.backup_keep_daily}" title="${esc(H.backup_keep_daily || '')}"></div>
      <div><label title="${esc(H.backup_keep_weekly || '')}">weekly</label><input id="bkW" type="number" min="1" value="${st.backup_keep_weekly}" title="${esc(H.backup_keep_weekly || '')}"></div>
      <div><label title="${esc(H.backup_keep_monthly || '')}">monthly</label><input id="bkM" type="number" min="1" value="${st.backup_keep_monthly}" title="${esc(H.backup_keep_monthly || '')}"></div></div>
    <p class="muted" id="bkKeepHelp" style="font-size:12px;margin:4px 0 0">Keep: the newest backup from each of the last <i>daily</i> days, <i>weekly</i> weeks
      and <i>monthly</i> months (12 months ≈ a year). ${esc(H.retention || '')}</p>
    <div class="tog"><input type="checkbox" id="bkAtt" ${st.backup_attachments ? 'checked' : ''}><span title="${esc(H.backup_attachments || '')}">Include photos and documents</span></div>
    <label title="${esc(H.backup_second_dir || '')}">Second copy to (drive, NAS or synced folder — optional)</label><input id="bkDir" value="${esc(st.backup_second_dir)}">
    <div class="row" style="margin-top:8px"><button class="b" id="bkSave">Save backup settings</button></div>`;
  app.appendChild(card);
  card.querySelectorAll('[data-exp]').forEach(btn => btn.addEventListener('click', () => {
    const f = btn.dataset.exp;
    download(`/desk-api/export?format=${f}`, `service-desk-${new Date().toISOString().slice(0, 10)}.${f === 'xlsx' ? 'xlsx' : 'zip'}`);
  }));
  const runImport = async dry => {
    const f = $('#impFile').files[0]; if (!f) { toast('Choose a file first.'); return; }
    const fd = new FormData(); fd.append('file', f, f.name); fd.append('dry_run', dry ? '1' : '0');
    try {
      const r = (await api('POST', '/desk-api/import', fd, true)).result;
      $('#impOut').textContent = `${r.dry_run ? 'Dry run — nothing imported yet.' : 'Imported as ' + r.batch_id + ' (undo for 7 days).'}
Rows: ${r.rows}, to add: ${r.to_add}, duplicates: ${r.duplicates.length}, invalid: ${r.invalid.length}` +
        r.invalid.slice(0, 10).map(x => `\n  row ${x.row}: ${x.problems.join(', ')}`).join('');
      $('#impGo').classList.toggle('hide', !(r.dry_run && r.to_add));
    } catch (e) { toast(e.message); }
  };
  $('#impDry').addEventListener('click', () => runImport(true));
  $('#impGo').addEventListener('click', () => { if (confirm('Import now? A backup is taken first.')) runImport(false); });
  $('#undoGo').addEventListener('click', async () => {
    const id = $('#undoId').value.trim(); if (!id || !confirm(`Remove every ticket imported in ${id}?`)) return;
    try { const r = (await api('POST', '/desk-api/import/undo', { batch_id: id })).result; toast(`Removed ${r.removed.length} ticket(s).`); }
    catch (e) { toast(e.message); }
  });
  $('#bkNow').addEventListener('click', async () => {
    try { const r = (await api('POST', '/desk-api/backups', {})).backup; toast(`Backed up (${r.verified ? 'verified' : 'NOT verified'}).`); showSettings(); }
    catch (e) { toast(e.message); }
  });
  card.querySelectorAll('[data-dl]').forEach(btn => btn.addEventListener('click', () => download(`/desk-api/backups/${btn.dataset.dl}`, btn.dataset.dl)));
  card.querySelectorAll('[data-rs]').forEach(btn => btn.addEventListener('click', async () => {
    const one = prompt('Restore ONE ticket? Enter its number (e.g. T-0042), or leave blank to restore EVERYTHING.');
    if (one === null) return;
    const what = one.trim() ? `ticket ${one.trim().toUpperCase()}` : 'ALL Service Desk data';
    if (!confirm(`Replace ${what} with the copy in this backup? A safety backup is taken first.`)) return;
    try {
      const r = (await api('POST', '/desk-api/backups/restore', { name: btn.dataset.rs, ticket_id: one.trim(), confirm: true })).result;
      toast(`Restored ${r.restored}. Safety backup: ${r.safety_backup}`); showSettings();
    } catch (e) { toast(e.message); }
  }));
  $('#bkSave').addEventListener('click', async () => {
    const vals = { backup_enabled: $('#bkOn').checked, backup_frequency: $('#bkFreq').value, backup_hour: +$('#bkHour').value,
      backup_keep_daily: +$('#bkD').value, backup_keep_weekly: +$('#bkW').value, backup_keep_monthly: +$('#bkM').value,
      backup_attachments: $('#bkAtt').checked, backup_second_dir: $('#bkDir').value.trim() };
    try { for (const [k, v] of Object.entries(vals)) await api('POST', '/desk-api/settings', { key: k, value: v }); toast('Saved.'); }
    catch (e) { toast(e.message); }
  });
}

// ── 🧙 How tickets move — diagram + walkthrough (2026-10-29, David) ───────────
// Demo only: everything comes from #wizRules; it makes no server calls and stores nothing.
/*WIZ*/
const WIZ = (() => {
  const R = JSON.parse($('#wizRules').textContent);
  const el = $('#wiz');
  const ROLE = { owner: 'Owner', manager: 'Manager', staff: 'Staff', field_crew: 'Field crew',
                 customer: 'Customer', subcontractor: 'Subcontractor' };
  // [centre x, centre y, width] in a 360 x 430 drawing; boxes are 40 high
  const NODES = { 'Open': [150, 40, 120], 'Assigned': [150, 130, 120], 'In Progress': [150, 220, 120],
                  'Fixed': [150, 310, 120], 'Closed': [150, 400, 120], 'On Hold': [305, 220, 96] };
  // one arrow per allowed move ("From>To"), routed so no two cross
  const EDGES = {
    'Open>Assigned': 'M140,60 V110', 'Assigned>Open': 'M160,110 V60',
    'Assigned>In Progress': 'M140,150 V200', 'In Progress>Assigned': 'M160,200 V150',
    'In Progress>Fixed': 'M140,240 V290', 'Fixed>In Progress': 'M160,290 V240',
    'Fixed>Closed': 'M150,330 V380',
    'Open>Closed': 'M90,40 H22 V414 H90', 'Assigned>Closed': 'M90,116 H38 V404 H90',
    'Closed>Assigned': 'M90,394 H54 V126 H90', 'Assigned>Fixed': 'M90,138 H70 V305 H90',
    'In Progress>On Hold': 'M210,212 H257', 'On Hold>In Progress': 'M257,228 H210',
    'Assigned>On Hold': 'M210,130 H305 V200', 'On Hold>Closed': 'M305,240 V408 H210',
    'In Progress>Closed': 'M210,236 H228 V392 H210'
  };
  const MEANS = {
    'Open': 'New — nobody has it yet.',
    'Assigned': 'Someone owns it; work hasn\'t started.',
    'In Progress': 'Being worked on.',
    'On Hold': 'Paused — waiting on the customer, parts or the weather.',
    'Fixed': 'The work is done; waiting for the customer to confirm.',
    'Closed': 'Done. A customer can reopen it within 7 days.'
  };
  const SAMPLE = { customer: 'Pat (the customer)', field_crew: 'Alex (field crew)', manager: 'Morgan (manager)' };
  const st = { ed: 'solo', tab: 'diagram', sel: 'Open', step: 0 };
  const why = new Set(R.needs_reason.map(p => p[0] + '>' + p[1]));
  const roleName = r => (st.ed === 'solo' && r === 'owner') ? 'You (owner)' : (ROLE[r] || r);
  const byName = r => r === 'owner' ? (st.ed === 'solo' ? 'You (owner)' : 'the owner') : (SAMPLE[r] || ROLE[r] || r);
  const means = s => MEANS[s] + (st.ed === 'business' && s === 'On Hold' ? ' The SLA clock stops while it waits.' : '');
  function note(r, k) {
    if (r === 'staff' || r === 'field_crew') return 'if it\'s assigned to them';
    if (r === 'customer') return k === 'Closed>Assigned' ? 'within 7 days of closing' : 'from their status link';
    if (r === 'subcontractor') return 'on a ticket shared with them';
    return '';
  }
  function autoClose() {
    const v = S.me && S.me.settings ? S.me.settings.auto_close_days : null;
    const n = (v == null || isNaN(+v)) ? 3 : +v;
    return n > 0 ? `If Pat stays quiet, it closes by itself after ${n} day${n === 1 ? '' : 's'} (Settings).`
                 : 'Auto-close is off in Settings, so it waits for you.';
  }

  function svg(o) {
    const mk = (id, c) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`;
    let h = `<svg class="wz-svg" id="wzSvg" viewBox="0 0 360 430" role="img" aria-label="The six ticket states and every allowed move between them">
      <defs>${mk('wzA', '#8a90a8')}${mk('wzR', '#ffb700')}${mk('wzH', '#00d4ff')}</defs>`;
    for (const [k, d] of Object.entries(EDGES)) {
      const w = why.has(k), hot = k === o.hot, hint = k === o.hint;
      const cls = 'wz-e' + (w ? ' why' : '') + (hot ? ' hot' : '') + (hint ? ' hint' : '');
      h += `<path class="${cls}" data-edge="${esc(k)}" d="${d}" marker-end="url(#${hot || hint ? 'wzH' : w ? 'wzR' : 'wzA'})"/>`;
    }
    for (const [s, [x, y, w]] of Object.entries(NODES)) {
      const c = 'wz-n' + (s === o.cur ? ' cur' : '') + (s === o.sel ? ' sel' : '') + (s === 'On Hold' ? ' hold' : '');
      const tap = o.tap ? ` data-wz="state" data-v="${esc(s)}" tabindex="0" role="button" aria-label="${esc(s)}: show its moves"` : '';
      h += `<g class="${c}" data-state="${esc(s)}"${tap}><rect x="${x - w / 2}" y="${y - 20}" width="${w}" height="40" rx="10"/>` +
           `<text x="${x}" y="${y + 5}" text-anchor="middle">${esc(s)}</text></g>`;
    }
    return h + '</svg>';
  }

  function head() {
    const mine = (S.me && S.me.edition) || '';
    const tb = (kind, v, label, on) => `<button class="wz-t${on ? ' on' : ''}" data-wz="${kind}" data-v="${v}" id="wz_${kind}_${v}" aria-pressed="${on}">${label}</button>`;
    return `<div class="wz-head"><h2 id="wzTitleBar">🧙 How tickets move</h2>
        <button class="ibtn" id="wzClose" data-wz="close" aria-label="Close" title="Close">✕</button></div>
      <div class="wz-row">${tb('tab', 'diagram', '🗺 Diagram', st.tab === 'diagram')}${tb('tab', 'walk', '▶ Walkthrough', st.tab === 'walk')}${tb('tab', 'file', '📨 How to file', st.tab === 'file')}</div>
      <div class="wz-row"><span class="muted" style="align-self:center;font-size:13px">Rules for</span>
        ${tb('ed', 'solo', 'Solo' + (mine === 'solo' ? ' · yours' : ''), st.ed === 'solo')}
        ${tb('ed', 'business', 'Business' + (mine === 'business' ? ' · yours' : ''), st.ed === 'business')}</div>`;
  }

  function diagram() {
    const s = st.sel, moves = R.transitions[s] || [];
    const rows = moves.map(to => {
      const k = s + '>' + to, who = (R.who[st.ed] || {})[k] || [];
      const names = who.map(r => esc(roleName(r)) + (note(r, k) ? ` <i>(${esc(note(r, k))})</i>` : '')).join(', ');
      return `<div class="wz-mv" data-to="${esc(to)}"><div><b>→ ${esc(to)}</b>${why.has(k) ? ' <span class="chip wz-why">✎ needs a reason</span>' : ''}</div>
        <div class="muted wz-who" style="font-size:13px">${who.length ? 'Who: ' + names : 'Nobody in this edition.'}</div></div>`;
    }).join('');
    return `<div class="wz-split"><div>${svg({ sel: s, tap: true })}
        <p class="muted wz-legend"><span class="wz-k"></span>a move<span class="wz-k why"></span>needs a written reason<br>Tap a state to see who can move it where.</p></div>
      <div class="card" id="wzInfo" aria-live="polite"><h3 style="margin:0">${esc(s)}</h3>
        <p class="muted" style="margin:4px 0 8px">${esc(means(s))}</p>${rows || '<p class="muted">No moves from here.</p>'}</div></div>`;
  }

  function walk() {
    const steps = R.steps, n = steps.length, p = steps[st.step], ed = st.ed;
    const edge = p.from ? p.from + '>' + p.state : '';
    const txt = (p.text[ed] || p.text.all).replace('{auto}', autoClose());
    return `<div class="wz-split"><div>${svg({ cur: p.state, hot: edge, hint: p.hint || '' })}</div>
      <div class="card" id="wzStep" aria-live="polite"><div class="muted" id="wzCount">Step ${st.step + 1} of ${n}</div>
        <h3 style="margin:2px 0 6px" id="wzStepTitle">${esc(p.title)}</h3>
        <div class="chips" style="margin-bottom:8px"><span class="chip st" id="wzState">${esc(p.state)}</span>
          ${edge ? `<span class="chip" id="wzMove">${esc(p.from)} → ${esc(p.state)}</span>` : ''}
          <span class="chip" id="wzBy">by ${esc(byName(p.by[ed]))}</span></div>
        <p style="margin:0 0 8px">${esc(txt)}</p>
        ${p.reason ? `<p class="wz-reason" id="wzReason"><b>✎ Reason:</b> ${esc(p.reason)}</p>` : ''}
        <div class="wz-dots">${steps.map((_, i) => `<button class="wz-dot${i === st.step ? ' on' : ''}" data-wz="go" data-v="${i}" aria-label="Step ${i + 1}"></button>`).join('')}</div>
        <div class="row" style="margin-top:10px"><button class="b ghost" id="wzPrev" data-wz="prev"${st.step ? '' : ' disabled'}>← Back</button>
          <button class="b" id="wzNext" data-wz="next">${st.step === n - 1 ? 'Finish ✓' : 'Next →'}</button></div>
        <p class="muted" style="font-size:12px;margin:8px 0 0">Demo only — no ticket is created or changed.</p></div></div>`;
  }

  // ── 📨 How to file (2026-10-29, David): the ways a ticket gets opened, with
  // the links to send. The links come from this page's own address (the
  // tunnel), so nothing is fetched; opened on the PC itself (localhost) it
  // points to the Business tab instead of showing a link that only works there.
  const KIND = k => k === 'external' ? 'Customer request' : k === 'subcontractor' ? 'Subcontractor ticket'
                  : (st.ed === 'solo' ? 'My own ticket' : 'Internal ticket');
  function urlFor(path) {
    return /^(localhost|127\.|\[::1\]$|::1$)/.test(location.hostname) ? '' : location.origin + path;
  }
  function urlRow(id, path) {
    const u = urlFor(path);
    return u ? `<div class="row wz-url"><input id="${id}" readonly value="${esc(u)}" aria-label="Link to send">
        <button class="b ghost" data-wz="copy" data-v="${id}" style="flex:0">📋 Copy</button></div>`
      : `<p class="wz-url muted" id="${id}">https://&lt;your address&gt;${esc(path)} — copy the real link from
        AI-Prowler → Business tab (📋 Copy · 📧 Email · 📱 QR).</p>`;
  }
  function copyLink(id) {
    const inp = $('#' + id); if (!inp || !inp.value) return;
    const done = () => toast('Link copied — paste it into a text or email.');
    try { navigator.clipboard.writeText(inp.value).then(done, () => { inp.select(); toast('Press and hold to copy the link.'); }); }
    catch (e) { inp.select(); toast('Press and hold to copy the link.'); }
  }
  function filing() {
    const C = R.create[st.ed] || {}, biz = st.ed === 'business';
    const who = k => (C[k] || []).map(r => esc(roleName(r))).join(', ') || 'nobody';
    const mine = S.me && S.me.edition === st.ed && Array.isArray(S.me.kinds)
      ? `<p class="muted" style="font-size:13px;margin:8px 0 0" id="wzMine">Signed in as you, right now you can file:
          <b>${S.me.kinds.map(k => esc(KIND(k))).join(', ') || 'nothing (switched off in Settings)'}</b>.</p>` : '';
    return `<div class="wz-file" id="wzFile">
      <div class="card" id="wzFileCust"><h3 style="margin:0 0 4px">👤 Customers — the request form</h3>
        <p style="margin:0 0 8px">No app and no account: they fill in the form, confirm with a code sent by text or
          email, and get a status link for their ticket. It arrives as a <b>Customer request</b>, Open.</p>
        ${urlRow('wzUrlSupport', '/support/new')}
        <p class="muted" style="font-size:13px;margin:8px 0 0">Send it by text or email, put it on your website, or add it
          to every invoice and receipt: Jobs app → Database → Settings → <b>Service Request Link</b> (type <b>auto</b>).
          Switch the form on in ${biz ? 'AI-Prowler → 🏢 Small Business tab → Service Desk settings' : '⚙︎ Settings'} → “Customers can request service online” (needs email set up).</p></div>
      <div class="card" id="wzFileTeam"><h3 style="margin:0 0 4px">${biz ? '👷 Your team — this app' : '🧑‍🔧 You (owner) — this app'}</h3>
        <p style="margin:0 0 8px">${biz
          ? 'Everyone on the team — owner, managers, office staff and field crew — signs in here with their AI-Prowler name and password and taps <b>+</b> (bottom right). They can file a <b>Customer request</b> for a customer who called, an <b>Internal ticket</b>, or a <b>Subcontractor ticket</b>. Send them this link from AI-Prowler → Business tab (📧 Email · 📱 QR).'
          : 'Sign in here with your Bearer Token and tap <b>+</b> (bottom right). File a <b>Customer request</b> for a customer who called or texted you (add their phone or email so they get updates), <b>My own ticket</b> as a to-do for yourself, or a <b>Subcontractor ticket</b> about a sub\'s work.'}</p>
        ${urlRow('wzUrlDesk', '/desk/')}${mine}</div>
      ${biz ? '' : `<div class="card" id="wzFileStaff"><h3 style="margin:0 0 4px">👥 Helpers and employees</h3>
        <p style="margin:0">Solo has no employee sign-ins. A helper can use the customer request form above (it arrives
          as a customer request and comes to you), or you file it for them with <b>+</b>. For team sign-ins, use the
          Business edition.</p></div>`}
      <div class="card" id="wzFileWho"><h3 style="margin:0 0 6px">Who can open which kind</h3>
        ${['external', 'internal', 'subcontractor'].map(k => `<div class="wz-mv" data-kind="${k}"><b>${esc(KIND(k))}</b>
          <div class="muted wz-who" style="font-size:13px">${who(k)}</div></div>`).join('')}
        <p class="muted" style="font-size:12px;margin:8px 0 0">Also: Claude can open one for you (“open a ticket for…”),
          and ${biz ? 'the Service Desk settings in AI-Prowler (🏢 Small Business tab)' : '⚙︎ Settings'} decide what happens with a text or email that isn't a reply to a ticket.</p></div>
    </div>`;
  }

  function render() { el.querySelector('.wz-box').innerHTML = head() + (st.tab === 'walk' ? walk() : st.tab === 'file' ? filing() : diagram()); }
  function open() {
    st.ed = (S.me && S.me.edition) || (S.mode === 'server' ? 'business' : 'solo');
    st.tab = 'diagram'; st.sel = 'Open'; st.step = 0;
    render(); el.classList.add('show'); document.body.classList.add('wizzing');
    $('#wzClose').focus();
  }
  function close() {
    el.classList.remove('show'); document.body.classList.remove('wizzing');
    const b = $('#wizBtn'); if (b) b.focus();
  }

  el.addEventListener('click', e => {
    const b = e.target.closest('[data-wz]');
    if (!b) { if (e.target === el) close(); return; }
    const act = b.getAttribute('data-wz'), v = b.getAttribute('data-v');
    switch (act) {
      case 'close': close(); return;
      case 'copy': copyLink(v); return;
      case 'tab': st.tab = v; break;
      case 'ed': st.ed = v; break;
      case 'state': st.sel = v; break;
      case 'go': st.step = +v; break;
      case 'prev': st.step = Math.max(0, st.step - 1); break;
      case 'next': if (st.step >= R.steps.length - 1) { close(); return; } st.step++; break;
      default: return;
    }
    render();
    // keep keyboard focus on the control that was used
    const again = act === 'prev' || act === 'next' ? $('#wzNext')
      : [...el.querySelectorAll(`[data-wz="${act}"]`)].find(x => x.getAttribute('data-v') === v);
    if (again && again.focus) again.focus();
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Escape') { close(); return; }
    const g = e.target.closest && e.target.closest('g[data-wz]');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
    if (st.tab === 'walk') {
      if (e.key === 'ArrowRight' && st.step < R.steps.length - 1) { e.preventDefault(); $('#wzNext').click(); }
      if (e.key === 'ArrowLeft' && st.step > 0) { e.preventDefault(); $('#wzPrev').click(); }
    }
  });
  $('#wizBtn').addEventListener('click', open);
  return { open, close };
})();
/*WIZ_END*/
boot();
</script>
</body>
</html>

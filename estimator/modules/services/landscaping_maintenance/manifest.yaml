# Landscaping maintenance: monthly lawn and yard upkeep, bid the way local crews bid it.
# Main question is the yard-size tier (flat price per visit). For big or commercial
# properties an exact size can be typed instead; that prices per 1,000 sq ft and gets
# cheaper per acre as the property grows (first 11,000 sq ft full rate, the rest half rate).
id: landscaping_maintenance
name: Landscaping Maintenance
version: 0.2.0
category: service
path: quick_estimate
description: Monthly lawn and yard upkeep priced by yard size and visits, with edging, hedge trimming, bed weeding and leaf cleanup.
minimum_charge: "80.00"
keywords: [landscaping maintenance, lawn care, lawn service, lawn mowing, mow, mowing, mow my lawn, yard maintenance, yard work, hedge trimming, hedges, weeding, leaf cleanup, edging, gardener]
# A won quote with one of these answers becomes a repeating job in AI-Prowler.
recurrence: {question: visits, map: {weekly: Weekly, biweekly: Biweekly, monthly: Monthly}}
questions:
  - id: yard_size
    label: "Yard size"
    type: choice
    default: standard
    help: "Pick the closest size. Most city lots are Standard. A quarter acre is about 11,000 sq ft. Choose No mowing if you only need hedges or beds."
    choices:
      - {value: none, label: "No mowing (hedges or beds only)", factor: "0"}
      - {value: small, label: "Small (under 1/4 acre)", factor: "1"}
      - {value: standard, label: "Standard (1/4 to 1/2 acre)", factor: "2"}
      - {value: large, label: "Large (1/2 to 1 acre)", factor: "3"}
      - {value: xlarge, label: "Extra large (over 1 acre)", factor: "4"}
  - id: exact_size
    label: "Exact size (optional)"
    type: number
    default: 0
    min: 0
    max: 2000000
    help: "For big or commercial properties. Leave at 0 to use the yard size above. If you type a size here, Yard size is ignored (except No mowing), and the price is figured per 1,000 sq ft, getting cheaper per acre as the property gets bigger."
  - id: exact_unit
    label: "Exact size unit"
    type: choice
    default: sqft
    help: "Is the exact size in square feet or acres? 1 acre = 43,560 sq ft."
    choices:
      - {value: sqft, label: "Square feet", factor: "1"}
      - {value: acre, label: "Acres", factor: "43560"}
  - id: visits
    label: "How often?"
    type: choice
    default: biweekly
    help: "Weekly keeps it neat in growing season. Every 2 weeks is the most common plan."
    choices:
      - {value: weekly, label: "Weekly (4 visits a month)", factor: "4"}
      - {value: biweekly, label: "Every 2 weeks (2 visits a month)", factor: "2"}
      - {value: monthly, label: "Monthly (1 visit)", factor: "1"}
  - {id: edging, label: "Edging each visit?", type: boolean, default: false, help: "Clean edges along sidewalks, driveway and beds with a string trimmer or edger."}
  - {id: edge_ft, label: "Edging length (optional)", type: number, unit: ft, default: 0, min: 0, max: 50000, help: "For big properties. Leave at 0 for a normal yard (flat price per visit). If you type the feet of edging, it's priced per 100 ft each visit."}
  - id: hedges
    label: "Hedge and shrub trimming (monthly)"
    type: choice
    default: none
    help: "A few bushes is up to about 10 shrubs. Full yard is lots of shrubs. For long hedge rows pick a By the foot choice and type the length in Hedge length. Small jobs have a $75 minimum."
    choices:
      - {value: none, label: "None", factor: "0"}
      - {value: few, label: "A few bushes", factor: "1"}
      - {value: full, label: "Full yard", factor: "2"}
      - {value: ft_low, label: "By the foot, under 6 ft tall", factor: "3"}
      - {value: ft_tall, label: "By the foot, over 6 ft tall", factor: "4"}
  - {id: hedge_ft, label: "Hedge length", type: number, unit: ft, default: 0, min: 0, max: 20000, help: "Only for the By the foot hedge choices. Measure the length of the hedge row in feet."}
  - id: beds
    label: "Flower bed weeding (monthly)"
    type: choice
    default: none
    help: "Small is one or two beds by the house. Large is beds around most of the yard."
    choices:
      - {value: none, label: "None", factor: "0"}
      - {value: small, label: "Small beds", factor: "1"}
      - {value: large, label: "Large beds", factor: "2"}
  - {id: leaf_cleanup, label: "One-time leaf cleanup?", type: boolean, default: false, help: "Rake, blow and haul away leaves once. Priced by yard size."}
  # --- Desert / regional add-ons ---
  - id: rock_area
    label: "Rock / desert yard upkeep"
    type: choice
    default: none
    help: "For rock, gravel or desert-style yards. Each visit: rake rock, blow off paths and pull loose weeds. Small is a front yard, Standard is front and back, Large is a big lot."
    choices:
      - {value: none, label: "None", factor: "0"}
      - {value: small, label: "Small rock area", factor: "1"}
      - {value: standard, label: "Standard rock area", factor: "2"}
      - {value: large, label: "Large rock area", factor: "3"}
  - id: weed_spray
    label: "Weed spraying (monthly)"
    type: choice
    default: none
    help: "Pre-emergent and post-emergent spray for rock and gravel areas, once a month. Pick the size of the area sprayed."
    choices:
      - {value: none, label: "None", factor: "0"}
      - {value: small, label: "Small area", factor: "1"}
      - {value: standard, label: "Standard area", factor: "2"}
      - {value: large, label: "Large area", factor: "3"}
  - {id: irrigation_check, label: "Irrigation / drip check (monthly)?", type: boolean, default: false, help: "Check drip lines and sprinklers for leaks, fix clogged emitters and set the timer for the season. Bigger repairs are quoted separately."}
  - id: palm_height
    label: "Palm tree trimming (one time)"
    type: choice
    default: none
    help: "Trim dead fronds and seed pods and haul them away. Pick the height of most of the palms, then type how many in Palm trees."
    choices:
      - {value: none, label: "None", factor: "0"}
      - {value: under20, label: "Under 20 ft", factor: "1"}
      - {value: mid, label: "20 to 40 ft", factor: "2"}
      - {value: over40, label: "Over 40 ft", factor: "3"}
  - {id: palm_qty, label: "Palm trees", type: integer, default: 1, min: 1, max: 200, help: "How many palms to trim. Only used when a palm height is picked."}
  - {id: trees_qty, label: "Other trees to prune (one time)", type: integer, default: 0, min: 0, max: 200, help: "Citrus, mesquite, palo verde and other yard trees under about 25 ft. Bigger trees need a tree service quote."}
  - {id: overseed, label: "Winter rye overseeding (one time)?", type: boolean, default: false, help: "Fall seeding of winter rye grass so the lawn stays green in winter. Grass lawns only, done in the fall when nights cool down. Priced by yard size."}
  - {id: green_waste, label: "Green waste haul-away (monthly)?", type: boolean, default: false, help: "Haul away trimmings and clippings when it's more than the customer's green bin can hold."}
  - {id: hard_access, label: "Steep slope or hard access?", type: boolean, default: false, help: "Hillside yard, narrow side gates, lots of steps or obstacles. Adds a little to each visit for the extra time."}
lines:
  # Yard-size tiers: flat price per visit.
  - {id: mow_small, description: "Mowing, small yard (per visit)", kind: other, unit: ea, quantity: "visits", price_key: lm_mow_small_ea, when: "yard_size == 1 and exact_size == 0"}
  - {id: mow_standard, description: "Mowing, standard yard (per visit)", kind: other, unit: ea, quantity: "visits", price_key: lm_mow_standard_ea, when: "yard_size == 2 and exact_size == 0"}
  - {id: mow_large, description: "Mowing, large yard (per visit)", kind: other, unit: ea, quantity: "visits", price_key: lm_mow_large_ea, when: "yard_size == 3 and exact_size == 0"}
  - {id: mow_xlarge, description: "Mowing, extra large yard (per visit)", kind: other, unit: ea, quantity: "visits", price_key: lm_mow_xlarge_ea, when: "yard_size == 4 and exact_size == 0"}
  # Exact size: per 1,000 sq ft per visit, half rate past 11,000 sq ft, 12-unit minimum per visit.
  - {id: mow_exact, description: "Mowing by area (per 1,000 sq ft, per month)", kind: other, unit: ea, quantity: "ceil(max(min(exact_size * exact_unit / 1000, 11) + max(exact_size * exact_unit / 1000 - 11, 0) * 0.5, 12)) * visits", price_key: lm_mow_ksqft, when: "exact_size > 0 and yard_size > 0"}
  - {id: edging, description: "Edging (per month)", kind: other, unit: ea, quantity: "visits", price_key: lm_edge_ea, when: "edging and edge_ft == 0"}
  # Edging by length: per 100 ft each visit.
  - {id: edging_ft, description: "Edging by length (per 100 ft, per month)", kind: other, unit: ea, quantity: "ceil(edge_ft / 100) * visits", price_key: lm_edge_100ft, when: "edging and edge_ft > 0"}
  - {id: hedges_few, description: "Hedge trimming, a few bushes (monthly)", kind: other, unit: ea, quantity: "1", price_key: lm_hedge_few_ea, when: "hedges == 1"}
  - {id: hedges_full, description: "Hedge trimming, full yard (monthly)", kind: other, unit: ea, quantity: "1", price_key: lm_hedge_full_ea, when: "hedges == 2"}
  # Hedges by the foot, with a ~$75 customer minimum (42 ft low, 17 ft tall at sample costs).
  - {id: hedges_ft_low, description: "Hedge trimming by the foot, under 6 ft (monthly, 42 ft min)", kind: other, unit: lf, quantity: "max(hedge_ft, 42)", price_key: lm_hedge_lf_low, when: "hedges == 3"}
  - {id: hedges_ft_tall, description: "Hedge trimming by the foot, over 6 ft (monthly, 17 ft min)", kind: other, unit: lf, quantity: "max(hedge_ft, 17)", price_key: lm_hedge_lf_tall, when: "hedges == 4"}
  - {id: beds_small, description: "Bed weeding, small beds (monthly)", kind: other, unit: ea, quantity: "1", price_key: lm_bed_small_ea, when: "beds == 1"}
  - {id: beds_large, description: "Bed weeding, large beds (monthly)", kind: other, unit: ea, quantity: "1", price_key: lm_bed_large_ea, when: "beds == 2"}
  - {id: leaves_small, description: "Leaf cleanup, small yard (one time)", kind: other, unit: ea, quantity: "1", price_key: lm_leaf_small_ea, when: "leaf_cleanup and exact_size == 0 and yard_size <= 1"}
  - {id: leaves_standard, description: "Leaf cleanup, standard yard (one time)", kind: other, unit: ea, quantity: "1", price_key: lm_leaf_standard_ea, when: "leaf_cleanup and exact_size == 0 and yard_size == 2"}
  - {id: leaves_large, description: "Leaf cleanup, large yard (one time)", kind: other, unit: ea, quantity: "1", price_key: lm_leaf_large_ea, when: "leaf_cleanup and exact_size == 0 and yard_size == 3"}
  - {id: leaves_xlarge, description: "Leaf cleanup, extra large yard (one time)", kind: other, unit: ea, quantity: "1", price_key: lm_leaf_xlarge_ea, when: "leaf_cleanup and exact_size == 0 and yard_size == 4"}
  # Leaf cleanup by area: full rate for the first acre (44k sq ft), half rate after, 20-unit minimum.
  - {id: leaves_exact, description: "Leaf cleanup by area (per 1,000 sq ft, one time)", kind: other, unit: ea, quantity: "max(ceil(min(exact_size * exact_unit / 1000, 44) + max(exact_size * exact_unit / 1000 - 44, 0) * 0.5), 20)", price_key: lm_leaf_ksqft, when: "leaf_cleanup and exact_size > 0"}
  # --- Desert / regional add-ons ---
  - {id: rock_small, description: "Rock yard upkeep, small (per visit)", kind: other, unit: ea, quantity: "visits", price_key: lm_rock_small_ea, when: "rock_area == 1"}
  - {id: rock_standard, description: "Rock yard upkeep, standard (per visit)", kind: other, unit: ea, quantity: "visits", price_key: lm_rock_standard_ea, when: "rock_area == 2"}
  - {id: rock_large, description: "Rock yard upkeep, large (per visit)", kind: other, unit: ea, quantity: "visits", price_key: lm_rock_large_ea, when: "rock_area == 3"}
  - {id: weed_small, description: "Weed spraying, small area (monthly)", kind: other, unit: ea, quantity: "1", price_key: lm_weed_small_ea, when: "weed_spray == 1"}
  - {id: weed_standard, description: "Weed spraying, standard area (monthly)", kind: other, unit: ea, quantity: "1", price_key: lm_weed_standard_ea, when: "weed_spray == 2"}
  - {id: weed_large, description: "Weed spraying, large area (monthly)", kind: other, unit: ea, quantity: "1", price_key: lm_weed_large_ea, when: "weed_spray == 3"}
  - {id: irrigation, description: "Irrigation / drip check (monthly)", kind: other, unit: ea, quantity: "1", price_key: lm_irrigation_ea, when: "irrigation_check"}
  - {id: palms_under20, description: "Palm trimming, under 20 ft (one time)", kind: other, unit: ea, quantity: "palm_qty", price_key: lm_palm_under20_ea, when: "palm_height == 1"}
  - {id: palms_mid, description: "Palm trimming, 20 to 40 ft (one time)", kind: other, unit: ea, quantity: "palm_qty", price_key: lm_palm_mid_ea, when: "palm_height == 2"}
  - {id: palms_over40, description: "Palm trimming, over 40 ft (one time)", kind: other, unit: ea, quantity: "palm_qty", price_key: lm_palm_over40_ea, when: "palm_height == 3"}
  - {id: trees, description: "Tree pruning, under 25 ft (one time)", kind: other, unit: ea, quantity: "trees_qty", price_key: lm_tree_prune_ea, when: "trees_qty > 0"}
  - {id: overseed_small, description: "Winter rye overseeding, small yard (one time)", kind: other, unit: ea, quantity: "1", price_key: lm_overseed_small_ea, when: "overseed and exact_size == 0 and yard_size == 1"}
  - {id: overseed_standard, description: "Winter rye overseeding, standard yard (one time)", kind: other, unit: ea, quantity: "1", price_key: lm_overseed_standard_ea, when: "overseed and exact_size == 0 and yard_size == 2"}
  - {id: overseed_large, description: "Winter rye overseeding, large yard (one time)", kind: other, unit: ea, quantity: "1", price_key: lm_overseed_large_ea, when: "overseed and exact_size == 0 and yard_size == 3"}
  - {id: overseed_xlarge, description: "Winter rye overseeding, extra large yard (one time)", kind: other, unit: ea, quantity: "1", price_key: lm_overseed_xlarge_ea, when: "overseed and exact_size == 0 and yard_size == 4"}
  - {id: overseed_exact, description: "Winter rye overseeding by area (per 1,000 sq ft, one time)", kind: other, unit: ea, quantity: "max(ceil(exact_size * exact_unit / 1000), 10)", price_key: lm_overseed_ksqft, when: "overseed and exact_size > 0 and yard_size > 0"}
  - {id: green_waste, description: "Green waste haul-away (monthly)", kind: other, unit: ea, quantity: "1", price_key: lm_green_waste_ea, when: "green_waste"}
  - {id: hard_access, description: "Steep slope / hard access (per visit)", kind: other, unit: ea, quantity: "visits", price_key: lm_hard_access_ea, when: "hard_access and yard_size + rock_area > 0"}

# House cleaning: quick estimate priced on estimated labor hours plus add-ons.
id: house_cleaning
name: House Cleaning
version: 0.1.0
category: service
path: quick_estimate
description: Standard, deep and move-in/out cleans priced from rooms, size, condition and visit frequency.
minimum_charge: "120.00"
keywords: [clean a house, clean house, house clean, clean a home, clean the home, clean my home, cleaning service, cleaning lady, cleaners, house cleaner, home cleaner, apartment, condo, bedroom, bathroom, housekeeping, maid service, house cleaning, home cleaning, clean my house, clean the house, maid, deep clean, move out clean, move-out clean, move in clean, move-in clean, recurring clean, bedrooms, bathrooms]
# A won quote with one of these answers becomes a repeating job in AI-Prowler.
recurrence: {question: frequency, map: {weekly: Weekly, biweekly: Biweekly, monthly: Monthly}}

questions:
  - {id: bedrooms, label: Bedrooms, type: integer, required: true, min: 0, max: 20}
  - {id: bathrooms, label: Bathrooms, type: number, required: true, min: 0, max: 20,
     help: "Half baths count as 0.5."}
  - {id: sqft, label: "Home size", type: number, unit: sqft, required: true, min: 100, max: 20000}
  - id: condition
    label: "Condition (1 = very clean, 5 = very dirty)"
    type: choice
    default: "3"
    choices:
      - {value: "1", label: "1 - very clean", factor: "0.8"}
      - {value: "2", label: "2 - clean", factor: "0.9"}
      - {value: "3", label: "3 - average", factor: "1.0"}
      - {value: "4", label: "4 - dirty", factor: "1.2"}
      - {value: "5", label: "5 - very dirty", factor: "1.5"}
  - {id: pets, label: "Pets in the home?", type: boolean, default: false}
  - id: frequency
    label: "How often?"
    type: choice
    default: one_time
    choices:
      - {value: one_time, label: "One time", factor: "1.0"}
      - {value: weekly, label: "Weekly (20% off)", factor: "0.80"}
      - {value: biweekly, label: "Every 2 weeks (15% off)", factor: "0.85"}
      - {value: monthly, label: "Monthly (10% off)", factor: "0.90"}
  - {id: move_in_out, label: "Move-in / move-out clean?", type: boolean, default: false}
  - {id: oven, label: "Clean inside the oven?", type: boolean, default: false}
  - {id: fridge, label: "Clean inside the fridge?", type: boolean, default: false}
  - {id: interior_windows, label: "Interior windows", type: integer, default: 0, min: 0, max: 200}

lines:
  - id: labor
    description: "Cleaning labor"
    kind: other
    unit: hr
    quantity: "round((1 + 0.5 * bedrooms + 0.75 * bathrooms + sqft / 1000 * 0.75) * condition * (1.25 if move_in_out else 1) + (0.25 if pets else 0), 2) * frequency"
    price_key: hc_labor_hr
  - {id: oven, description: "Inside oven", kind: other, unit: ea, quantity: "1", price_key: hc_oven_ea, when: "oven"}
  - {id: fridge, description: "Inside fridge", kind: other, unit: ea, quantity: "1", price_key: hc_fridge_ea, when: "fridge"}
  - {id: windows, description: "Interior windows", kind: other, unit: ea, quantity: "interior_windows",
     price_key: hc_window_ea, when: "interior_windows > 0"}

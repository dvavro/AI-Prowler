# Pool service: monthly maintenance price plus optional one-time work.
id: pool_service
name: Pool Service
version: 0.1.0
category: service
path: quick_estimate
description: Monthly pool maintenance priced by visits, pool size and spa, with chemicals, filter cleaning and green-pool cleanup.
minimum_charge: "100.00"
keywords: [pool service, pool cleaning, my pool, swimming pool, pool guy, pool water, clean my pool, pool maintenance, pool, spa, hot tub, green pool, pool chemicals, filter clean]
# A won quote with one of these answers becomes a repeating job in AI-Prowler.
recurrence: {question: visits, map: {weekly: Weekly, biweekly: Biweekly}}

questions:
  - id: visits
    label: "How often?"
    type: choice
    required: true
    choices:
      - {value: weekly, label: "Weekly (about 4 visits a month)", factor: "4"}
      - {value: biweekly, label: "Every 2 weeks (2 visits a month)", factor: "2"}
  - id: pool_type
    label: "Pool only, or pool and spa?"
    type: choice
    default: pool
    choices:
      - {value: pool, label: "Pool only", factor: "1.0"}
      - {value: pool_and_spa, label: "Pool and spa", factor: "1.3"}
  - id: size
    label: "Pool size"
    type: choice
    default: medium
    choices:
      - {value: small, label: "Small (under 15,000 gal)", factor: "0.9"}
      - {value: medium, label: "Medium (15,000-25,000 gal)", factor: "1.0"}
      - {value: large, label: "Large (over 25,000 gal)", factor: "1.25"}
  - {id: chemicals, label: "Include chemicals?", type: boolean, default: true}
  - {id: filter_clean, label: "Filter cleaning this month?", type: boolean, default: false}
  - id: cleanup
    label: "Does the pool need a one-time cleanup first?"
    type: choice
    default: none
    choices:
      - {value: none, label: "No, it's clear", factor: "0"}
      - {value: cloudy, label: "Cloudy", factor: "1"}
      - {value: green, label: "Green", factor: "2.5"}

lines:
  - {id: service, description: "Monthly pool service (visits, size adjusted)", kind: other, unit: ea,
     quantity: "visits * pool_type * size", price_key: ps_visit_ea}
  - {id: chemicals, description: "Chemicals", kind: material, unit: ea, quantity: "visits",
     price_key: ps_chemicals_ea, when: "chemicals"}
  - {id: filter, description: "Filter cleaning", kind: other, unit: ea, quantity: "1",
     price_key: ps_filter_ea, when: "filter_clean"}
  - {id: cleanup, description: "One-time pool cleanup", kind: other, unit: ea, quantity: "cleanup",
     price_key: ps_cleanup_ea, when: "cleanup > 0"}

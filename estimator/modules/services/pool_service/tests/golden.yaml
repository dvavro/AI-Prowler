# Golden cases: sample prices, no markups. Totals in cents (one month).
- name: weekly, medium pool, chemicals included (defaults)
  answers: {}
  # 4 visits x $26 = $104; chemicals 4 x $6 = $24
  expected_lines: {service: 10400, chemicals: 2400}
  expected_total_cents: 12800
- name: biweekly large pool and spa, no chemicals, filter clean, green cleanup
  answers: {visits: biweekly, pool_type: pool_and_spa, size: large, chemicals: false, filter_clean: true, cleanup: green}
  # 2 x 1.3 x 1.25 = 3.25 x $26 = $84.50; filter $75; cleanup 2.5 x $100 = $250
  expected_lines: {service: 8450, filter: 7500, cleanup: 25000}
  expected_total_cents: 40950
- name: chemicals-only weekly - raised to the $100 minimum
  answers: {service_level: chem_only}

  expected_lines: {service: 5720, chemicals: 2400}
  expected_total_cents: 10000
- name: one-time cleaning, medium pool, with acid wash (no monthly lines)
  answers: {visits: one_time, acid_wash: true}
  expected_lines: {one_time: 11700, acid_wash: 30100}
  expected_total_cents: 41800
- name: weekly extra large salt pool with debris, tile clean, drain and refill, 2 repair hours
  answers: {size: xlarge, salt: true, debris: true, tile_clean: true, drain_refill: true, repair_hours: 2}

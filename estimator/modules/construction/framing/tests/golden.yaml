# Golden cases: sample prices, no markups. Totals in cents.
- name: 100 ft of 8 ft 2x4 interior wall at 16 in, defaults
  answers: {wall_lf: 100}
  # studs: ceil(100 x 12 / 16) = 75 + 4 corners x 2 = 83 studs x 8 ft = 664 lf x 1.10 x $0.60 = $438.24
  # plates: 300 lf x 1.10 x $0.60 = $198; hardware 100 x $0.60; labor 100 x $9
  expected_lines: {studs_2x4: 43824, plates_2x4: 19800, hardware: 6000, wall_labor: 90000}
  expected_total_cents: 159624
- name: 160 ft of 9 ft 2x6 exterior wall, 6 corners, 8 openings, sheathed

            baseboard_lf: 80, transitions: 2}
  # tile 300 x 1.17 x $3.50 = $1,228.50; baseboard 88 x $3.25 = $286
  expected_lines: {remove_soft: 22500, prep: 37500, tile: 122850, setting: 45000, install_tile: 165000,
                   diagonal: 22500, baseboard: 28600, transitions: 5000}
  expected_total_cents: 448950
- name: 800 sq ft carpet with 13 stairs, old carpet removed
  answers: {area_sqft: 800, material: carpet, stairs: 13, remove_old: carpet}
  expected_lines: {remove_soft: 60000, carpet: 242000, pad: 54600, install_carpet: 100000, stairs: 78000}

# Golden cases: sample prices, no markups. Totals in cents.
- name: 500 sq ft LVP
  answers: {area_sqft: 500, material: lvp}
  # 500 x 1.07 x $2.75 = $1,471.25; install 500 x $2.00
  expected_lines: {lvp: 147125, install_plank: 100000}
  expected_total_cents: 247125
- name: 300 sq ft diagonal tile, carpet removed, prep, 80 ft baseboard, 2 transitions

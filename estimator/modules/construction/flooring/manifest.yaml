# Flooring from typed room areas (no plans needed).
# Waste follows the spec: LVP/laminate 7%, tile 12%, hardwood 8%, carpet 10%, diagonal +5%.
id: flooring
name: Flooring
version: 0.1.0
category: construction
path: both
description: LVP, laminate, tile, hardwood and carpet priced from floor area, with waste, underlayment, removal, prep, baseboard, stairs and transitions - and garage / concrete floor coatings (epoxy or enamel with paint chips, polyurea / polyaspartic) with grinding, crack repair, chips, clear top coat and stem walls.
minimum_charge: "500.00"
# 2026-11-27 (David: "add estimating for Floor coating like Enamel coating with paint chips and poly coating for garage
# or concrete applications"): the two coating systems are flooring types (6, 7) with their own questions below
keywords: [flooring, floor install, new floors, new floor, tile floor, hardwood, laminate, carpet install, install carpet, new carpet, install lvp, install tile, install hardwood, install laminate, install flooring, lvp, vinyl plank, luxury vinyl, floor coating, garage floor coating, garage floor, epoxy floor, epoxy garage, epoxy coating, concrete coating, concrete floor coating, flake floor, chip floor, paint chips, polyaspartic, polyurea, poly coating]
# Good / better / best for the bid: same rooms, different flooring.
scenarios:
  - {id: good, label: "Good: laminate", answers: {material: laminate}}
  - {id: better, label: "Better: luxury vinyl plank", answers: {material: lvp}}
  - {id: best, label: "Best: hardwood", answers: {material: hardwood}}

questions:
  - {id: area_sqft, label: "Floor area", type: number, unit: sqft, required: true, min: 10, max: 50000, help: "Floor area to cover, in square feet. Extra for waste is added automatically."}
  - id: material
    help: "LVP and laminate are budget-friendly, tile is durable and waterproof, hardwood costs the most, carpet is softest. For a garage or other concrete floor, pick a coating: epoxy / enamel with paint chips, or polyurea / polyaspartic (faster cure, UV-stable, tougher)."
    label: "Flooring type"
    type: choice
    required: true
    # factor is a code used by the line rules
    choices:
      - {value: lvp, label: "Luxury vinyl plank (LVP)", factor: "1"}
      - {value: laminate, label: "Laminate", factor: "2"}
      - {value: tile, label: "Ceramic / porcelain tile", factor: "3"}
      - {value: hardwood, label: "Hardwood", factor: "4"}
      - {value: carpet, label: "Carpet", factor: "5"}
      - {value: coating_epoxy, label: "Concrete coating: epoxy / enamel (garage)", factor: "6"}
      - {value: coating_poly, label: "Concrete coating: polyurea / polyaspartic (garage)", factor: "7"}
  # --- concrete coatings only (flooring type 6 or 7); they change nothing for the other flooring types
  - id: coat_prep
    help: "Coatings only. Diamond grinding opens the concrete so the coating bonds - the pro standard. Acid etching is cheaper but bonds less well."
    label: "Coating: concrete prep"
    type: choice
    default: grind
    choices:
      - {value: grind, label: "Diamond grind", factor: "1"}
      - {value: etch, label: "Acid etch and rinse", factor: "2"}
      - {value: none, label: "None (already prepared)", factor: "0"}
  - id: coat_chips
    help: "Coatings only. Paint chips (flakes) broadcast into the base coat: a full broadcast covers the floor solid, a light one is a sprinkle."
    label: "Coating: paint chips (flakes)"
    type: choice
    default: full
    choices:
      - {value: full, label: "Full broadcast", factor: "2"}
      - {value: light, label: "Light broadcast", factor: "1"}
      - {value: none, label: "No chips (solid color)", factor: "0"}
  - {id: coat_topcoat, label: "Coating: clear top coat?", type: boolean, default: true, help: "Coatings only. A clear polyaspartic top coat over the chips - glossy, UV-stable and easy to clean."}
  - {id: coat_crack_lf, label: "Coating: cracks and joints to fill", type: number, unit: lf, default: 0, min: 0, max: 5000, help: "Coatings only. Feet of cracks and control joints to fill before coating."}
  - {id: coat_stem_lf, label: "Coating: stem wall / cove", type: number, unit: lf, default: 0, min: 0, max: 5000, help: "Coatings only. Feet of garage stem wall (the low concrete curb) or cove base to coat as well."}
  - id: pattern
    help: "Straight is standard. Diagonal or herringbone takes more cuts and about 5% more material."
    label: "Layout"
    type: choice
    default: straight
    # factor is the extra waste
    choices:
      - {value: straight, label: "Straight", factor: "0"}
      - {value: diagonal, label: "Diagonal or herringbone (+5% waste)", factor: "0.05"}
  - id: remove_old
    help: "Tear out the old floor first. Tile and hardwood take more labor to remove than carpet or vinyl."
    label: "Remove the old floor?"
    type: choice
    default: none
    choices:
      - {value: none, label: "No", factor: "0"}
      - {value: carpet, label: "Carpet or vinyl", factor: "1"}
      - {value: hard, label: "Tile or hardwood", factor: "2"}
  - {id: subfloor_prep, label: "Level / patch the subfloor?", type: boolean, default: false, help: "Patch and level the floor underneath so the new flooring lies flat and doesn't crack or squeak."}
  - {id: baseboard_lf, label: "New baseboard", type: number, unit: lf, default: 0, min: 0, max: 10000, help: "Feet of new baseboard trim around the room edges."}
  - {id: stairs, label: "Stairs (steps)", type: integer, default: 0, min: 0, max: 100, help: "Number of steps to cover. Each step is extra labor."}
  - {id: transitions, label: "Transition strips", type: integer, default: 0, min: 0, max: 100, help: "Strips where the new floor meets another floor type or a doorway."}
  - {id: permit, label: "Pull a permit?", type: boolean, default: false, help: "Flooring rarely needs a permit, but some buildings or HOAs require one."}
  - {id: inspections, label: "Inspections to schedule", type: integer, default: 0, min: 0, max: 20, help: "Inspection or re-inspection fees not already in the permit."}

lines:
  - {id: remove_soft, description: "Remove old carpet / vinyl", kind: labor, unit: sqft, quantity: "area_sqft",
     price_key: fl_remove_soft_sqft, when: "remove_old == 1"}
  - {id: remove_hard, description: "Remove old tile / hardwood", kind: labor, unit: sqft, quantity: "area_sqft",
     price_key: fl_remove_hard_sqft, when: "remove_old == 2"}
  - {id: prep, description: "Level and patch subfloor", kind: labor, unit: sqft, quantity: "area_sqft",
     price_key: fl_prep_sqft, when: "subfloor_prep"}
  - {id: lvp, description: "Luxury vinyl plank", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.07 + pattern", price_key: fl_lvp_sqft, when: "material == 1"}
  - {id: laminate, description: "Laminate flooring", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.07 + pattern", price_key: fl_laminate_sqft, when: "material == 2"}
  - {id: tile, description: "Tile", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.12 + pattern", price_key: fl_tile_sqft, when: "material == 3"}
  - {id: hardwood, description: "Hardwood flooring", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.08 + pattern", price_key: fl_hardwood_sqft, when: "material == 4"}
  - {id: carpet, description: "Carpet", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.10", price_key: fl_carpet_sqft, when: "material == 5"}
  - {id: underlayment, description: "Underlayment", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.05", price_key: fl_underlay_sqft, when: "material == 2 or material == 4"}
  - {id: pad, description: "Carpet pad", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.05", price_key: fl_pad_sqft, when: "material == 5"}
  - {id: setting, description: "Thinset, grout and backer", kind: material, unit: sqft, quantity: "area_sqft",
     price_key: fl_setting_sqft, when: "material == 3"}
  - {id: install_plank, description: "Install plank flooring", kind: labor, unit: sqft, quantity: "area_sqft",
     price_key: fl_lab_plank_sqft, when: "material == 1 or material == 2"}
  - {id: install_tile, description: "Install tile", kind: labor, unit: sqft, quantity: "area_sqft",
     price_key: fl_lab_tile_sqft, when: "material == 3"}
  - {id: install_hardwood, description: "Install hardwood", kind: labor, unit: sqft, quantity: "area_sqft",
     price_key: fl_lab_hardwood_sqft, when: "material == 4"}
  - {id: install_carpet, description: "Install carpet", kind: labor, unit: sqft, quantity: "area_sqft",
     price_key: fl_lab_carpet_sqft, when: "material == 5"}
  - {id: diagonal, description: "Diagonal / herringbone layout (extra labor)", kind: labor, unit: sqft,
     quantity: "area_sqft", price_key: fl_diagonal_sqft, when: "pattern > 0 and material < 6"}
  # Concrete coatings (2026-11-27): prep, repair, base coat, chips, clear top coat, application, stem wall
  - {id: coat_grind, description: "Diamond grind concrete (coating prep)", kind: labor, unit: sqft, quantity: "area_sqft",
     price_key: fl_coat_grind_sqft, when: "material >= 6 and coat_prep == 1"}
  - {id: coat_etch, description: "Acid etch and rinse concrete (coating prep)", kind: labor, unit: sqft, quantity: "area_sqft",
     price_key: fl_coat_etch_sqft, when: "material >= 6 and coat_prep == 2"}
  - {id: coat_cracks, description: "Fill cracks and control joints", kind: material, unit: lf, quantity: "coat_crack_lf",
     price_key: fl_coat_crack_lf, when: "material >= 6 and coat_crack_lf > 0"}
  - {id: coat_epoxy, description: "Epoxy / enamel base coat", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.10", price_key: fl_coat_epoxy_sqft, when: "material == 6"}
  - {id: coat_poly, description: "Polyurea / polyaspartic base coat", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.10", price_key: fl_coat_poly_sqft, when: "material == 7"}
  - {id: coat_chips_full, description: "Paint chips (flakes), full broadcast", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.10", price_key: fl_coat_chip_full_sqft, when: "material >= 6 and coat_chips == 2"}
  - {id: coat_chips_light, description: "Paint chips (flakes), light broadcast", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.10", price_key: fl_coat_chip_light_sqft, when: "material >= 6 and coat_chips == 1"}
  - {id: coat_topcoat, description: "Clear polyaspartic top coat", kind: material, unit: sqft, quantity: "area_sqft",
     waste: "0.10", price_key: fl_coat_top_sqft, when: "material >= 6 and coat_topcoat"}
  - {id: coat_apply, description: "Apply coating system (base, chips, scrape, top coat)", kind: labor, unit: sqft,
     quantity: "area_sqft", price_key: fl_lab_coat_sqft, when: "material >= 6"}
  - {id: coat_stem, description: "Coat stem wall / cove base", kind: labor, unit: lf, quantity: "coat_stem_lf",
     price_key: fl_coat_stem_lf, when: "material >= 6 and coat_stem_lf > 0"}
  - {id: baseboard, description: "Baseboard, supplied and installed", kind: material, unit: lf, quantity: "baseboard_lf",
     waste: "0.10", price_key: fl_baseboard_lf, when: "baseboard_lf > 0"}
  - {id: stairs, description: "Stairs", kind: labor, unit: ea, quantity: "stairs", price_key: fl_stair_ea,
     when: "stairs > 0"}
  - {id: transitions, description: "Transition strips", kind: material, unit: ea, quantity: "transitions",
     price_key: fl_transition_ea, when: "transitions > 0"}
  - {id: permit, description: "Permit", kind: other, unit: ea, quantity: "1", price_key: fl_permit_ea, when: "permit"}
  - {id: inspections, description: "Inspections", kind: other, unit: ea, quantity: "inspections", price_key: fl_inspect_ea, when: "inspections > 0"}

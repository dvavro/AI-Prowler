# Golden cases: sample prices, no markups (Personal-mode defaults). Totals in cents.
- name: service call only hits the minimum charge
  answers: {doors: 1}
  # service call 59.53 -> minimum 95
  expected_subtotal_cents: 5953
  expected_total_cents: 9500
- name: single door tune-up
  answers: {doors: 1, tune_up: true}
  # service call 59.53; tune-up 1 x 1.0 x 60.20
  expected_lines: {service_call: 5953, tune_up: 6020}
  expected_total_cents: 11973
- name: double door, torsion spring pair, cables and rollers
  answers: {doors: 1, door_size: double, springs: torsion_pair, cables: true, rollers: true}
  # service call 59.53; springs 166.13; cables 95.85; rollers 1 x 1.25 x 95.85 = 119.8125 -> 119.81
  expected_lines: {service_call: 5953, spring_pair: 16613, cables: 9585, rollers: 11981}

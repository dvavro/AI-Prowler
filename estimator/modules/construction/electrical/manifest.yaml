  # hours: EMT 4.5 / 100 ft, PVC 3.5 / 100 ft (strapped on the surface, bends, cuts), pulling THHN 0.6 / 100 ft of
  # conductor, each expansion fitting or conduit body 0.5
  - {id: conduit_labor, description: "Run conduit on the surface and pull the wire", kind: labor, unit: hr,
     quantity: "((emt_050_ft + emt_075_ft + emt_100_ft) * 0.045 + (pvc_050_ft + pvc_075_ft + pvc_100_ft) * 0.035 + (thhn_14_ft + thhn_12_ft + thhn_10_ft + thhn_8_ft + thhn_6_ft) * 0.006 + (emt_expansion + pvc_expansion + conduit_bodies) * 0.5) * (1.25 if voltage == 3 else 1)",
     price_key: el_labor_hr, when: "emt_050_ft + emt_075_ft + emt_100_ft + pvc_050_ft + pvc_075_ft + pvc_100_ft > 0"}

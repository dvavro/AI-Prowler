  # Branch breakers follow the voltage (single-pole at 110 V, 2-pole at 220 V, 3-pole at 3-phase);
  # dedicated circuits keep their amperage breaker (15 Amp single-pole, 30 Amp 2-pole).
  # 2026-11-20 (David): the branch breakers are counted from the panel schedule when given (else one per 10 devices),
  # and are AFCI by default - the 2020 NEC (210.12) wants AFCI on nearly every 15/20 Amp circuit in a home.
  - {id: breakers, description: "Breakers (single-pole)", kind: material, unit: ea,
     quantity: "circuits_15a + ((branch_circuits if branch_circuits > 0 else ceil((outlets + usb_outlets + quad_outlets + wp_outlets + floor_boxes + switches + switches_3way + switches_4way + dimmers + occupancy_switches + gfci + lights + recessed_lights + wall_lights + pendant_lights + undercabinet_lights + exterior_lights + exit_emergency_lights + smoke_detectors + fans + exhaust_fans) / 10)) if work >= 1 and voltage == 1 else 0)",
     price_key: el_breaker_ea, when: "breaker_type == 1 and (circuits_15a > 0 or (voltage == 1 and work >= 1 and (branch_circuits > 0 or outlets + usb_outlets + quad_outlets + wp_outlets + floor_boxes + switches + switches_3way + switches_4way + dimmers + occupancy_switches + gfci + lights + recessed_lights + wall_lights + pendant_lights + undercabinet_lights + exterior_lights + exit_emergency_lights + smoke_detectors + fans + exhaust_fans > 0)))"}
  - {id: breakers_afci, description: "AFCI breakers (single-pole)", kind: material, unit: ea,
     quantity: "circuits_15a + ((branch_circuits if branch_circuits > 0 else ceil((outlets + usb_outlets + quad_outlets + wp_outlets + floor_boxes + switches + switches_3way + switches_4way + dimmers + occupancy_switches + gfci + lights + recessed_lights + wall_lights + pendant_lights + undercabinet_lights + exterior_lights + exit_emergency_lights + smoke_detectors + fans + exhaust_fans) / 10)) if work >= 1 and voltage == 1 else 0)",
     price_key: el_breaker_afci_ea, when: "breaker_type == 2 and (circuits_15a > 0 or (voltage == 1 and work >= 1 and (branch_circuits > 0 or outlets + usb_outlets + quad_outlets + wp_outlets + floor_boxes + switches + switches_3way + switches_4way + dimmers + occupancy_switches + gfci + lights + recessed_lights + wall_lights + pendant_lights + undercabinet_lights + exterior_lights + exit_emergency_lights + smoke_detectors + fans + exhaust_fans > 0)))"}
  - {id: breakers_dual, description: "Dual-function AFCI/GFCI breakers (single-pole)", kind: material, unit: ea,
     quantity: "circuits_15a + ((branch_circuits if branch_circuits > 0 else ceil((outlets + usb_outlets + quad_outlets + wp_outlets + floor_boxes + switches + switches_3way + switches_4way + dimmers + occupancy_switches + gfci + lights + recessed_lights + wall_lights + pendant_lights + undercabinet_lights + exterior_lights + exit_emergency_lights + smoke_detectors + fans + exhaust_fans) / 10)) if work >= 1 and voltage == 1 else 0)",

# Golden cases: sample prices, no markups. Totals in cents.
# 2026-11-20 (David): devices and fixtures are separate labor lines (device_labor / fixture_labor - the hours are the
# same as before, split in two); branch breakers are AFCI by default ($45); small parts $1.50 per device on new and old
# work; fixtures the owner supplies are $0 'other' lines (not on the Bill of Materials).
- name: New work, 10 outlets, 4 switches, 6 lights
  answers: {outlets: 10, switches: 4, lights: 6}
  # labor 10 x 0.5 + 4 x 0.5 = 7 hr x $90 (devices) + 6 x 0.75 = 4.5 hr x $90 (fixtures); wire 20 x 25 = 500 lf x 1.15 x
  # $0.55 = $316.25; AFCI breakers ceil(20 / 10) = 2 x $45; small parts 20 x $1.50
  # 2026-11-20: device boxes 14 x $3; each light gets a fixture-rated box, 6 x $6
  expected_lines: {device_labor: 63000, fixture_labor: 40500, outlets: 4000, switches: 1600, lights: 0, boxes_plastic: 4200,
                   fixture_boxes: 3600, wire: 31625, breakers_afci: 9000, small_parts: 3000, permit: 20000}
  expected_total_cents: 180525
- name: Old work, 2 fans, 2 GFCIs, 1 dedicated circuit, 40 ft runs
  answers: {work: remodel, fans: 2, gfci: 2, appliance_circuits: 1, avg_run_ft: 40}
  # devices 2 x 0.75 x 1.6 = 2.4 hr; fans 2 x 1.5 x 1.6 = 4.8 hr; circuit 3 x 1.6 = 4.8 hr; the fan units are the owner's
  # backward compat: an old-style appliance_circuits answer still prices, as a 30 Amp circuit (heavy wire + 2-pole breaker)
  expected_lines: {device_labor: 21600, fixture_labor: 43200, circuit_labor: 43200, gfci: 4400, fan_units: 0, fan_boxes: 3000,
                   boxes_plastic: 600, wire: 10120, heavy_wire: 11500, breakers_afci: 4500, breakers_2pole: 7000,
                   small_parts: 600, permit: 20000}
  expected_total_cents: 169720
- name: New work, 4 bath exhaust fans
  answers: {exhaust_fans: 4}
  # 2026-11-19: labor 4 x 1.0 = 4 hr x $90; wire 4 x 25 = 100 lf x 1.15 x $0.55 = $63.25; breakers ceil(4 / 10) = 1
  # (no boxes: an exhaust fan has its own housing; the fan unit is the customer's)
  expected_lines: {fixture_labor: 36000, wire: 6325, breakers_afci: 4500, small_parts: 600, permit: 20000}
  expected_total_cents: 67425
- name: Switches by type, each its own line to order
  answers: {switches: 10, switches_3way: 4, switches_4way: 1, dimmers: 2, occupancy_switches: 1}
  # 2026-11-19: labor 10 x 0.5 + (4 + 1 + 1) x 0.75 + 2 x 0.5 = 10.5 hr x $90; parts $4 / $8 / $15 / $20 / $35 each
  # boxes 18 x $3; wire 18 x 25 = 450 lf x 1.15 x $0.55 = $284.63 (rounded half-up); breakers ceil(18 / 10) = 2
  expected_lines: {device_labor: 94500, switches: 4000, switches_3way: 3200, switches_4way: 1500, dimmers: 4000,
                   occupancy_switches: 3500, boxes_plastic: 5400, wire: 28463, breakers_afci: 9000, small_parts: 2700,
                   permit: 20000}
  expected_total_cents: 176263
- name: Outlets by type, each its own line to order
  answers: {usb_outlets: 2, quad_outlets: 2, floor_boxes: 1, wp_outlets: 2}
  # 2026-11-19: labor 2 x 0.5 + 2 x 0.75 + 1 x 1.5 + 2 x 1.0 = 6 hr x $90; parts $25 / $10 / $45 / $34 each
  # boxes 6 x $3 (a floor box is its own box); wire 7 x 25 = 175 lf x 1.15 x $0.55 = $110.69; breakers ceil(7 / 10) = 1
  expected_lines: {device_labor: 54000, usb_outlets: 5000, quad_outlets: 2000, floor_boxes: 4500, wp_outlets: 6800,
                   boxes_plastic: 1800, wire: 11069, breakers_afci: 4500, small_parts: 1050, permit: 20000}
  expected_total_cents: 110719
- name: Lights by type, supplied by the owner - we hang and wire them
  answers: {lights: 15, recessed_lights: 4, wall_lights: 6, pendant_lights: 2, undercabinet_lights: 3, exterior_lights: 2,
            exit_emergency_lights: 1}
  # labor (15 + 4 + 6 + 3) x 0.75 + (2 + 2 + 1) x 1.0 = 26 hr x $90; the fixtures are the owner's ($0 lines on the quote,
  # "supplied by the owner"); boxes 33 x $3; wire 33 x 25 = 825 lf x 1.15 x $0.55 = $521.81; AFCI breakers 4
  expected_lines: {fixture_labor: 234000, lights: 0, recessed_lights: 0, wall_lights: 0, pendant_lights: 0,
                   undercabinet_lights: 0, exterior_lights: 0, exit_emergency_lights: 0, boxes_plastic: 900,
                   fixture_boxes: 15600, recessed_housings: 5600, wire: 52181, breakers_afci: 18000, small_parts: 4950,
                   permit: 20000}
  # 2026-11-20: boxes we charge for even when the owner supplies the fixtures - undercabinet 3 x $3 (device box),
  # fixture-rated boxes (15 + 6 + 2 + 2 + 1) x $6, recessed housings 4 x $14
  expected_total_cents: 351231
- name: Lights and fans we supply - priced and on the Bill of Materials
  answers: {lights: 2, recessed_lights: 4, fans: 1, fixtures: us}
  # labor (2 + 4) x 0.75 + 1 x 1.5 = 6 hr x $90; fixtures 2 x $45 + 4 x $25 + fan $150; fan box $15; boxes 6 x $3
  # (a fan box is its own); wire 7 x 25 x 1.15 x $0.55 = $110.69; 1 AFCI breaker; small parts 7 x $1.50
  expected_lines: {fixture_labor: 54000, lights_us: 9000, recessed_lights_us: 10000, fan_units_us: 15000, fan_boxes: 1500,
                   fixture_boxes: 1200, wire: 11069, breakers_afci: 4500, small_parts: 1050, permit: 20000}
  # 2026-11-20: 2 fixture-rated boxes x $6; the recessed housings come with the recessed lights we supply
  expected_total_cents: 127319

# Golden cases: sample prices, no markups. Totals in cents.
# 2026-11-14 (v0.2.0): leveling (grade_pad) is on by default - 400 sq ft x $0.30 = $120 more on the default cases.
# 2026-11-15 (v0.3.0): footing_section_sqft (default 1.0 = 12 x 12 in) - the cases without it are unchanged.
- name: 400 sq ft patio, defaults (4 in, mesh, broom, gravel base, pad leveled)
  answers: {area_sqft: 400}
  # grade 400 x $0.30; base 400 x $0.75; forms ceil(4 x sqrt 400) = 80 lf x $3.50; mesh 440 x $0.35;
  # concrete 4.9383 cy x 1.05 x $165 = $855.56; finish 400 x $2.25; joints 400 x $0.15
  expected_lines: {grade: 12000, base: 30000, forms: 28000, mesh: 15400, concrete: 85556, place_finish: 90000, joints: 6000}
  expected_total_cents: 266956
- name: 400 sq ft patio, pad already level
  answers: {area_sqft: 400, grade_pad: false}
  expected_lines: {base: 30000, forms: 28000, mesh: 15400, concrete: 85556, place_finish: 90000, joints: 6000}
  expected_total_cents: 254956
- name: 600 sq ft stamped driveway, 5 in, rebar, removal, 40 ft footing, pump
  answers: {area_sqft: 600, thickness_in: "5", perimeter_lf: 110, reinforcement: rebar, finish: stamped,
            remove_existing: true, footing_lf: 40, pump: true}
  # concrete (600 x 5 / 12 / 27 + 40 / 27) = 10.7407 cy x 1.05 x $165 = $1,860.83
  # rebar 800 lf x 1.10 x $0.85 = $748; footing rebar 80 x 1.10 x $0.85 = $74.80 (default #4 size); grade 600 x $0.30
  expected_lines: {removal: 120000, grade: 18000, base: 45000, forms: 38500, footing: 24000, rebar: 74800,
                   footing_rebar_4: 7480, concrete: 186083, place_finish: 135000, stamped: 270000, joints: 9000,
                   pump: 65000}
  expected_total_cents: 992863
- name: 600 sq ft stamped driveway, 5 in, rebar, removal, 40 ft footing, #5 footing rebar, pump
  answers: {area_sqft: 600, thickness_in: "5", perimeter_lf: 110, reinforcement: rebar, finish: stamped,
            remove_existing: true, footing_lf: 40, footing_rebar_size: "5", pump: true}
  # same as the case above except footing rebar: 80 lf x 1.10 x $1.25 = $110.00 (vs $74.80 for #4);
  # the slab rebar grid stays #4 (rebar: 74800). Total 992863 - 7480 + 11000 = 996383.
  expected_lines: {removal: 120000, grade: 18000, base: 45000, forms: 38500, footing: 24000, rebar: 74800,
                   footing_rebar_5: 11000, concrete: 186083, place_finish: 135000, stamped: 270000, joints: 9000,
                   pump: 65000}
  expected_total_cents: 996383
- name: 600 sq ft stamped driveway, 40 ft footing with a 12 x 18 in cross-section below the slab
  answers: {area_sqft: 600, thickness_in: "5", perimeter_lf: 110, reinforcement: rebar, finish: stamped,
            remove_existing: true, footing_lf: 40, footing_section_sqft: 1.5, pump: true}
  # 2026-11-15 (v0.3.0): the footing below the slab uses its own cross-section (12 x 18 in = 1.5 sq ft per foot)
  # instead of a fixed 12 x 12: concrete (600 x 5 / 12 / 27 + 40 x 1.5 / 27) = 11.4815 cy x 1.05 x $165 = $1,989.17.
  # Everything else as the first driveway case: 992863 - 186083 + 198917 = 1005697.
  expected_lines: {removal: 120000, grade: 18000, base: 45000, forms: 38500, footing: 24000, rebar: 74800,
                   footing_rebar_4: 7480, concrete: 198917, place_finish: 135000, stamped: 270000, joints: 9000,
                   pump: 65000}
  expected_total_cents: 1005697
